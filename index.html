/* =====================================================================
   BERANDA SISWA — halaman berdiri sendiri, tersambung ke Apps Script
   milik Ustadz Iqbal. Tidak membawa API key: seluruh aksi yang dipakai
   (siswaMasuk, siswaRingkas, studentRecap) dilayani server sebelum
   pemeriksaan key, jadi tautannya aman dibagikan ke grup kelas.

   Satu pertanyaan yang harus dijawab halaman ini dalam sekali lihat:
   "berapa nilaiku, apa yang belum kukumpulkan, absenku bagaimana."
   ===================================================================== */
:root {
  --kertas: #F2F5F0;        /* kertas sejuk, bukan krem */
  --papan: #FFFFFF;
  --tinta: #16241C;         /* hitam kehijauan, bukan abu bertint */
  --tinta-2: #4A5C51;
  --tinta-3: #7C8A82;
  --jade: #1D6B4C;          /* warna sistem Ustadz */
  --jade-tua: #124430;
  --jade-muda: #E3EDE6;
  --emas: #A9761F;          /* yang belum dikumpulkan */
  --emas-muda: #F7EFDC;
  --merah: #92291F;         /* sudah lewat batas */
  --merah-muda: #F8E6E3;
  --garis: #D8E0D9;
  --garis-tipis: #E8EDE8;
  --tombol-teks: #FFFFFF;   /* tulisan di atas tombol utama */
  --r: 10px;
}
/* Mode gelap mengikuti HP siswa. Ditulis tidak bersarang supaya didukung juga
   oleh peramban lama, dan dijaga :not([data-theme="light"]) agar pilihan
   terang yang disetel eksplisit tetap menang. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --kertas: #101712; --papan: #17201A; --tinta: #E8EFE9; --tinta-2: #AEBDB3;
    --tinta-3: #7E8E84; --jade: #58B189; --jade-tua: #8ED0AC; --jade-muda: #1B2A21;
    --emas: #D9A64B; --emas-muda: #2A2318; --merah: #E08C82; --merah-muda: #2B1A18;
    --garis: #2A362E; --garis-tipis: #212B24;
    --tombol-teks: #0C1710;
  }
}
:root[data-theme="dark"] {
  --kertas: #101712; --papan: #17201A; --tinta: #E8EFE9; --tinta-2: #AEBDB3;
  --tinta-3: #7E8E84; --jade: #58B189; --jade-tua: #8ED0AC; --jade-muda: #1B2A21;
  --emas: #D9A64B; --emas-muda: #2A2318; --merah: #E08C82; --merah-muda: #2B1A18;
  --garis: #2A362E; --garis-tipis: #212B24; --tombol-teks: #0C1710;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--kertas);
  color: var(--tinta);
  font: 400 16px/1.55 'Archivo', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 0 16px env(safe-area-inset-bottom) 16px;
}
.bungkus { max-width: 560px; margin: 0 auto; padding: 22px 0 56px; }

/* --- pita atas --------------------------------------------------- */
.pita { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }
/* Lambang asli sekolah, ditanam sebagai data URI supaya halaman ini tetap
   tidak memanggil apa pun dari luar — tetap tampil walau ikonnya belum
   ikut ter-upload ke hosting. */
.pita img { width: 34px; height: 34px; flex: none; border-radius: 8px; display: block; }
.pita b { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.pita span { color: var(--tinta-3); font-size: 13px; }

/* --- masuk ------------------------------------------------------- */
.masuk { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 26px 22px; }
.masuk h1 { font: 600 25px/1.2 'Zilla Slab', Georgia, serif; margin: 0 0 6px; letter-spacing: -.01em; }
.masuk p { color: var(--tinta-2); margin: 0 0 20px; font-size: 14.5px; max-width: 42ch; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--tinta-2); margin-bottom: 7px; }
input[type=text], input[type=email] {
  width: 100%; font: 500 19px/1 'Zilla Slab', Georgia, serif; letter-spacing: .04em;
  padding: 14px 15px; border: 1.5px solid var(--garis); border-radius: 8px;
  background: var(--kertas); color: var(--tinta);
}
input[type=text]:focus, input[type=email]:focus { outline: 2.5px solid var(--jade); outline-offset: 1px; border-color: transparent; }
.tombol {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 15.5px/1 'Archivo', sans-serif; padding: 14px 20px; border-radius: 8px;
  border: 1.5px solid var(--jade-tua); background: var(--jade-tua); color: var(--tombol-teks);
  cursor: pointer; width: 100%; margin-top: 14px;
}
.tombol:active { transform: translateY(1px); }
.tombol:focus-visible { outline: 3px solid var(--jade); outline-offset: 2px; }
.tombol.sunyi { background: transparent; color: var(--jade-tua); border-color: var(--garis); width: auto; margin: 0; padding: 9px 14px; font-size: 13.5px; }
.tombol[disabled] { opacity: .55; cursor: progress; }
.galat { background: var(--merah-muda); color: var(--merah); border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-top: 14px; }
.galat b { display: block; margin-bottom: 2px; }

/* --- kepala siswa ------------------------------------------------ */
.kepala { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.kepala h1 { font: 600 26px/1.15 'Zilla Slab', Georgia, serif; margin: 0; letter-spacing: -.015em; flex: 1; }
.identitas { color: var(--tinta-3); font-size: 13.5px; margin: 0 0 24px; }
.identitas b { color: var(--tinta-2); font-weight: 600; }

/* --- judul bagian: garis jade, bukan label huruf besar ----------- */
h2.bagian {
  font: 600 13.5px/1 'Archivo', sans-serif; color: var(--jade-tua);
  margin: 30px 0 12px; padding-left: 10px; border-left: 3px solid var(--jade);
}

/* --- blok nilai per jenis kelas: rata kanan angka slab ----------- */
.mapel { background: var(--papan); border: 1px solid var(--garis); border-left: 3px solid var(--jade); border-radius: var(--r); padding: 16px 18px; margin-bottom: 12px; }
.mapel .atas { display: flex; align-items: baseline; gap: 12px; }
.mapel .nm { font: 600 17px/1.25 'Archivo', sans-serif; flex: 1; letter-spacing: -.01em; }
.mapel .angka { font: 600 34px/1 'Zilla Slab', Georgia, serif; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mapel .huruf { font: 600 14px/1 'Archivo', sans-serif; color: var(--jade-tua); background: var(--jade-muda); border-radius: 5px; padding: 5px 8px; }
.mapel .sub { color: var(--tinta-3); font-size: 13px; margin-top: 2px; }
.butir { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.butir div { background: var(--kertas); border: 1px solid var(--garis-tipis); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; color: var(--tinta-2); }
.butir div b { font: 600 14px 'Zilla Slab', Georgia, serif; color: var(--tinta); font-variant-numeric: tabular-nums; }
.tanpa { color: var(--tinta-3); font-size: 13.5px; margin-top: 12px; font-style: italic; }

/* --- tugas ------------------------------------------------------- */
.tugas { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 14px 16px; margin-bottom: 9px; }
.tugas .baris { display: flex; gap: 12px; align-items: flex-start; }
.tugas.belum { border-left: 3px solid var(--emas); }
.tugas.lewat { border-left: 3px solid var(--merah); }
.tugas.sudah { border-left: 3px solid var(--garis); }
.tugas .isi { flex: 1; min-width: 0; }
.tugas .j { font-weight: 600; font-size: 15px; letter-spacing: -.005em; }
.tugas .k { color: var(--tinta-3); font-size: 13px; margin-top: 3px; }
.tugas .n { font: 600 22px/1 'Zilla Slab', Georgia, serif; font-variant-numeric: tabular-nums; flex: none; }
.cap { font: 600 12px/1 'Archivo', sans-serif; border-radius: 5px; padding: 5px 7px; flex: none; white-space: nowrap; }

.cap.merah { background: var(--merah-muda); color: var(--merah); }

/* --- borang pengumpulan tugas ------------------------------------ */
.tugas > .tombol.sunyi { width: auto; margin-top: 11px; }

  width: 100%; font: 400 15px/1.5 'Archivo', sans-serif; letter-spacing: 0;

  background: var(--kertas); color: var(--tinta); resize: vertical;
}
.borang input[type=text]:focus, .borang textarea:focus { outline: 2.5px solid var(--jade); outline-offset: 1px; border-color: transparent; }
.petunjuk { background: var(--kertas); border-radius: 8px; padding: 11px 13px; font-size: 14px; color: var(--tinta-2); margin-bottom: 13px; white-space: pre-wrap; }
.anggota { display: flex; flex-direction: column; gap: 2px; max-height: 232px; overflow-y: auto; border: 1px solid var(--garis); border-radius: 8px; padding: 7px; background: var(--kertas); }
label.pilih { display: flex; align-items: center; gap: 9px; font-weight: 400; font-size: 14.5px; color: var(--tinta); margin: 0; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
label.pilih:hover { background: var(--jade-muda); }
label.pilih input { width: 19px; height: 19px; accent-color: var(--jade); flex: none; }
.kabar-ok { background: var(--jade-muda); color: var(--jade-tua); border-radius: var(--r); padding: 13px 15px; font-size: 14.5px; font-weight: 600; margin-bottom: 18px; }

/* --- absensi ----------------------------------------------------- */
.absen-ring { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.absen-ring div { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 12px 14px; flex: 1; min-width: 118px; }
.absen-ring small { display: block; color: var(--tinta-3); font-size: 12.5px; }
.absen-ring b { font: 600 24px/1.15 'Zilla Slab', Georgia, serif; font-variant-numeric: tabular-nums; }
table.absen { width: 100%; border-collapse: collapse; background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); overflow: hidden; }
table.absen td { padding: 10px 14px; border-top: 1px solid var(--garis-tipis); font-size: 14px; }

.st-Hadir { color: var(--jade-tua); }
.st-Sakit, .st-Izin { color: var(--emas); }
.st-Alpa { color: var(--merah); }

/* --- pengumuman -------------------------------------------------- */

.umum .atas { display: flex; align-items: baseline; gap: 9px; }
.umum .j { font-weight: 600; font-size: 15px; flex: 1; }

/* --- akun -------------------------------------------------------- */
.akun { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 16px 18px; }
.akun p { color: var(--tinta-2); font-size: 14px; margin: 0 0 14px; }

}

<script>
/* ---------------------------------------------------------------
 * Sambungan. Alamat /exec ditanam supaya siswa tidak perlu
 * mengetik apa pun. TIDAK ada API key di berkas ini.
 * ------------------------------------------------------------- */
var API = (function () {
  var bawaan = 'https://script.google.com/macros/s/AKfycbyV8s3_yYClutUiPfF7Jam_Tww6QFJkoZKABIFBEvEV_jdR6fRASdixXHGxjj043WDsJw/exec';
  /* Alamat lain hanya diterima kalau jelas-jelas mesin lokal. Itu pintu untuk
     pengujian otomatis; tautan yang disebar ke siswa TIDAK bisa dibelokkan ke
     server orang lain lewat ?api=, jadi nomor induk mereka tidak bisa dipanen. */
  try {
    var q = new URLSearchParams(location.search).get('api') || '';
    if (/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(q)) return q;
  } catch (e) { }
  return bawaan;
})();
var SIMPAN = 'beranda.nis';

function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
function tgl(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  if (!m) return String(s || '');
  return Number(m[3]) + ' ' + BLN[Number(m[2]) - 1] + ' ' + m[1];
}
function hariIni() { return new Date().toISOString().slice(0, 10); }
function angka(n) {
  if (n === null || n === undefined || n === '') return '';
  var x = Number(n);
  if (isNaN(x)) return String(n);
  return (Math.round(x * 10) / 10).toString().replace('.', ',');
}

/* Satu pintu ke server. Dipanggil TANPA key — aksi siswa dilayani
   sebelum pemeriksaan key, dan kalau server ternyata lebih lama,
   pesannya menjelaskan apa yang harus dilakukan. */
function panggil(action, payload) {
  var body = Object.assign({ action: action }, payload || {});
  return fetch(API, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.text(); }).then(function (t) {
    var j;
    try { j = JSON.parse(t); } catch (e) {
      throw new Error('Jawaban server tidak terbaca. Pastikan alamat /exec sudah di-deploy dengan akses "Anyone".');
    }
    if (!j.ok) {
      var m = String(j.error || 'Permintaan gagal.');
      if (/aksi tidak dikenal/i.test(m)) {
        throw new Error('Fitur ini belum ada di sistem yang sedang berjalan. '
          + 'Hubungi Ustadz: Code.gs perlu ditempel ulang lalu Deploy → Versi baru.');
      }
      throw new Error(m);
    }
    return j;
  }, function () {
    throw new Error('Tidak dapat menghubungi server. Periksa sambungan internetmu, lalu coba lagi.');
  });
}

var ST = { nomor: '', data: null, rinci: {}, sibuk: false, tugas: [], buka: '', roster: {} };

function ingat(n) { try { sessionStorage.setItem(SIMPAN, n); } catch (e) { } }
function diingat() { try { return sessionStorage.getItem(SIMPAN) || ''; } catch (e) { return ''; } }
function lupakan() { try { sessionStorage.removeItem(SIMPAN); } catch (e) { } }

/* ---------------------------------------------------------------
 * LAYAR MASUK
 * ------------------------------------------------------------- */
function layarMasuk(pesan) {
  el('layar').innerHTML = '<div class="masuk">'
    + '<h1>Masuk dengan Nomor Induk</h1>'
    + '<p>Ketik NIS atau NISN-mu. Tidak perlu memilih kelas dan nama — yang muncul hanya milikmu sendiri.</p>'
    + '<label for="nis">Nomor Induk (NIS / NISN)</label>'
    + '<input type="text" id="nis" inputmode="numeric" autocomplete="off" '
    + 'enterkeyhint="go" placeholder="contoh: 252610001">'
    + '<button class="tombol" id="btn-masuk">Lihat berandaku</button>'
    + (pesan ? '<div class="galat" role="alert"><b>Belum bisa masuk</b>' + esc(pesan) + '</div>' : '')
    + '</div>';
  el('kaki').textContent = 'Kalau nomor indukmu belum terdaftar, hubungi gurumu.';
  var i = el('nis');
  el('btn-masuk').addEventListener('click', masuk);
  i.addEventListener('keydown', function (e) { if (e.key === 'Enter') masuk(); });
  i.focus();
}

function masuk() {
  var i = el('nis');
  var n = i ? String(i.value || '').trim() : '';
  if (!n) { layarMasuk('Nomor induknya diisi dulu.'); return; }
  if (ST.sibuk) return;
  ST.sibuk = true;
  var b = el('btn-masuk');
  if (b) { b.disabled = true; b.textContent = 'Mencari datamu…'; }
  muat(n).then(function () {
    ST.sibuk = false;
    ingat(n);
    layarIsi();
  }, function (e) {
    ST.sibuk = false;
    layarMasuk(e.message || String(e));
  });
}

function muat(n) {
  return panggil('siswaRingkas', { nomor: n }).then(function (j) {
    ST.nomor = n;
    ST.data = j;
    /* Rincian per kelas diambil terpisah: dari situ datang tanggal
       absensi dan skala huruf milik sekolah. Kalau gagal, beranda
       tetap tampil — hanya rinciannya yang tidak ada. */
    var kelas = j.kelas || [];
    return Promise.all(kelas.map(function (k) {
      return panggil('studentRecap', { className: k, studentName: j.nama })
        .then(function (r) { ST.rinci[k] = r; }, function () { ST.rinci[k] = null; });
    })).then(function () { ST.tugas = daftarTugas(j); return j; });
  });
}

/* ---------------------------------------------------------------
 * Satu daftar tugas untuk seluruh halaman. Sumber utamanya
 * studentRecap, karena hanya di sana ada id tugas — dan tanpa id,
 * tugas tidak bisa dikumpulkan. Kalau rincian itu tidak bisa
 * diambil (server lebih lama), daftarnya jatuh ke siswaRingkas:
 * tugasnya tetap terlihat, hanya tidak bisa dikumpulkan dari sini.
 * ------------------------------------------------------------- */
function daftarTugas(d) {
  var out = [], ada = {};
  (d.kelas || []).forEach(function (k) {
    var r = ST.rinci[k];
    if (!r || !r.tugas) return;
    r.tugas.forEach(function (t) {
      ada[(k + '|' + String(t.title || '')).toUpperCase()] = 1;
      out.push({
        id: t.id, judul: t.title, mapel: t.subject || '', kelas: k,
        batas: t.dueDate || '', sudah: !!t.submitted, tanggal: String(t.submittedAt || '').slice(0, 10),
        nilai: (t.score === '' || t.score === null || t.score === undefined) ? null : t.score,
        maxScore: t.maxScore, status: t.status || '', tutup: String(t.status || '') === 'Tutup',
        mode: t.mode || '', groupMin: t.groupMin || '', groupMax: t.groupMax || '',
        petunjuk: t.instruction || '', anggota: t.members || '', kelompokNama: t.groupName || ''
      });
    });
  });
  /* Tugas yang hanya muncul di ringkasan tetap ditampilkan, supaya tidak
     ada yang hilang dari layar hanya karena rinciannya gagal diambil. */
  (d.perKelas || []).forEach(function (pk) {
    (pk.tugas || []).forEach(function (t) {
      if (ada[(pk.kelas + '|' + String(t.judul || '')).toUpperCase()]) return;
      out.push({
        id: '', judul: t.judul, mapel: t.mapel || '', kelas: pk.kelas,
        batas: t.batas || '', sudah: !!t.sudah, tanggal: t.tanggal || '',
        nilai: (t.nilai === '' || t.nilai === null || t.nilai === undefined) ? null : t.nilai,
        maxScore: t.maxScore, status: t.status || '', tutup: false,
        mode: '', groupMin: '', groupMax: '', petunjuk: '', anggota: '', kelompokNama: ''
      });
    });
  });
  return out;
}

/* ---------------------------------------------------------------
 * Nilai dikelompokkan per JENIS KELAS (mata pelajaran), karena
 * satu rombel bisa diampu dua mapel sekaligus — English Wajib dan
 * English Lanjut di XI 2, misalnya.
 * ------------------------------------------------------------- */
function perMapel(d) {
  var peta = {};
  function ambil(mapel, kelas) {
    var k = mapel + '|' + kelas;
    if (!peta[k]) peta[k] = { mapel: mapel, kelas: kelas, nilai: [], tugas: [] };
    return peta[k];
  }
  (d.perKelas || []).forEach(function (pk) {
    (pk.nilai || []).forEach(function (n) {
      ambil(n.mapel || 'Tanpa mata pelajaran', pk.kelas).nilai.push(n);
    });
    (pk.tugas || []).forEach(function (t) {
      ambil(t.mapel || 'Tanpa mata pelajaran', pk.kelas).tugas.push(t);
    });
  });
  return Object.keys(peta).sort().map(function (k) { return peta[k]; });
}

function rata(nilai) {
  var n = 0, j = 0;
  nilai.forEach(function (x) {
    var v = Number(x.nilai), m = Number(x.maks) > 0 ? Number(x.maks) : 100;
    if (!isNaN(v)) { j += (v / m) * 100; n++; }
  });
  return n ? { rata: j / n, n: n } : null;
}

/* Huruf memakai skala milik sekolah kalau servernya mengirimkannya. */
function huruf(kelas, nilai100) {
  var r = ST.rinci[kelas];
  var skala = r && r.rapor && r.rapor.skala;
  if (!skala || !skala.length) return '';
  for (var i = 0; i < skala.length; i++) {
    if (nilai100 >= Number(skala[i].min)) return String(skala[i].l);
  }
  return String(skala[skala.length - 1].l || '');
}

function blokMapel(g) {
  var r = rata(g.nilai);
  var h = r ? huruf(g.kelas, r.rata) : '';
  var sudah = g.tugas.filter(function (t) { return t.sudah; }).length;
  var s = '<div class="mapel"><div class="atas">'
    + '<div><div class="nm">' + esc(g.mapel) + '</div>'
    + '<div class="sub">' + esc(g.kelas)
    + (r ? ' · ' + r.n + ' butir nilai' : '') + '</div></div>'
    + (r ? '<div class="angka">' + angka(r.rata) + '</div>' : '')
    + (h ? '<div class="huruf">' + esc(h) + '</div>' : '')
    + '</div>';
  if (g.nilai.length) {
    s += '<div class="butir">' + g.nilai.map(function (n) {
      return '<div>' + esc(n.komponen || '—') + ' <b>' + angka(n.nilai) + '</b></div>';
    }).join('') + '</div>';
  } else {
    s += '<div class="tanpa">Belum ada nilai yang keluar untuk mata pelajaran ini.</div>';
  }
  if (g.tugas.length) {
    s += '<div class="sub" style="margin-top:12px">Tugas: ' + sudah + ' dari '
      + g.tugas.length + ' sudah dikumpulkan</div>';
  }
  return s + '</div>';
}

function barisTugas(t) {
  var lewat = !t.sudah && t.batas && String(t.batas) < hariIni();
  var kelas = t.sudah ? 'sudah' : (lewat ? 'lewat' : 'belum');
  var cap = t.sudah
    ? (t.nilai === null || t.nilai === undefined || t.nilai === ''
      ? '<span class="cap jade">Sudah dikumpulkan</span>'
      : '<span class="n">' + angka(t.nilai) + '</span>')
    : (lewat ? '<span class="cap merah">Lewat batas</span>'
      : '<span class="cap emas">Belum</span>');
  var ket = esc(t.mapel || '');
  if (t.batas) ket += (ket ? ' · ' : '') + 'batas ' + tgl(t.batas);
  if (t.sudah && t.tanggal) ket += ' · dikumpulkan ' + tgl(t.tanggal);
  if (t.mode === 'kelompok') ket += ' · tugas kelompok';
  /* Borangnya diletakkan DI BAWAH baris, bukan di dalam kolom kirinya:
     di dalam flex, lebarnya tinggal separuh dan kotak tautan terpotong. */
  return '<div class="tugas ' + kelas + '" data-id="' + esc(t.id || '') + '">'
    + '<div class="baris"><div class="isi">'
    + '<div class="j">' + esc(t.judul || '(tanpa judul)') + '</div>'
    + '<div class="k">' + ket + '</div></div>' + cap + '</div>'
    + tombolKumpul(t) + '</div>';
}

/* ---------------------------------------------------------------
 * PENGUMPULAN TUGAS — beranda ini juga tempat mengumpulkan, bukan
 * hanya melihat. Butuh id tugas, jadi hanya muncul kalau rincian
 * kelasnya berhasil diambil.
 * ------------------------------------------------------------- */
function tombolKumpul(t) {
  if (!t.id) return '';
  if (t.tutup) return '<div class="k" style="margin-top:6px">Pengumpulan sudah ditutup gurumu.</div>';
  var terbuka = ST.buka === t.id;
  var label = t.sudah ? 'Kumpulkan ulang' : 'Kumpulkan sekarang';
  return '<button class="tombol sunyi kumpul" data-buka="' + esc(t.id) + '" style="margin-top:9px">'
    + (terbuka ? 'Tutup' : label) + '</button>'
    + (terbuka ? borang(t) : '');
}

function borang(t) {
  var kelompok = String(t.mode || '') === 'kelompok';
  var daftar = ST.roster[t.kelas];
  var s = '<div class="borang" data-borang="' + esc(t.id) + '">';
  if (t.petunjuk) s += '<div class="petunjuk">' + esc(t.petunjuk) + '</div>';
  s += '<label for="tautan-' + esc(t.id) + '">Tautan hasil kerjamu</label>'
    + '<input type="text" id="tautan-' + esc(t.id) + '" inputmode="url" '
    + 'placeholder="https://… (Canva, Drive, Docs)" autocomplete="off">'
    + '<label for="catatan-' + esc(t.id) + '" style="margin-top:12px">Catatan untuk guru (boleh dikosongkan)</label>'
    + '<textarea id="catatan-' + esc(t.id) + '" rows="3" '
    + 'placeholder="misalnya: bagian yang masih kurang, atau kendala saat mengerjakan"></textarea>';
  if (kelompok) {
    s += '<label style="margin-top:12px">Anggota kelompok'
      + (t.groupMin || t.groupMax
        ? ' <span style="font-weight:400;color:var(--tinta-3)">('
          + (t.groupMin ? 'minimal ' + t.groupMin : '')
          + (t.groupMin && t.groupMax ? ', ' : '')
          + (t.groupMax ? 'maksimal ' + t.groupMax : '') + ' orang, termasuk kamu)</span>'
        : '') + '</label>';
    if (daftar === undefined) {
      s += '<div class="k">Memuat daftar teman sekelas…</div>';
    } else if (!daftar || !daftar.length) {
      s += '<div class="k">Daftar kelas tidak bisa dimuat. Tulis nama anggotanya dipisah koma.</div>'
        + '<input type="text" id="anggota-' + esc(t.id) + '" placeholder="Nama 1, Nama 2">';
    } else {
      s += '<div class="anggota">' + daftar.filter(function (n) {
        return String(n).toUpperCase() !== String(ST.data.nama || '').toUpperCase();
      }).map(function (n, i) {
        return '<label class="pilih"><input type="checkbox" value="' + esc(n)
          + '" data-anggota="' + esc(t.id) + '"> ' + esc(n) + '</label>';
      }).join('') + '</div>';
    }
  }
  s += '<div id="pesan-' + esc(t.id) + '"></div>'
    + '<button class="tombol" data-kirim="' + esc(t.id) + '">'
    + (t.sudah ? 'Kirim ulang' : 'Kumpulkan') + '</button>';
  if (t.sudah) {
    s += '<div class="k" style="margin-top:9px">Kiriman lamamu tidak dibuang — '
      + 'disimpan di bawah kiriman yang baru.</div>';
  }
  return s + '</div>';
}

function bukaBorang(id) {
  var t = ST.tugas.filter(function (x) { return x.id === id; })[0];
  ST.buka = (ST.buka === id) ? '' : id;
  if (ST.buka && t && String(t.mode || '') === 'kelompok' && ST.roster[t.kelas] === undefined) {
    ST.roster[t.kelas] = undefined;
    panggil('studentRoster', { className: t.kelas }).then(function (j) {
      var r = j.roster || j.names || j.data || [];
      ST.roster[t.kelas] = r.map(function (x) {
        return typeof x === 'string' ? x : String(x.name || x.nama || '');
      }).filter(Boolean);
      layarIsi();
    }, function () { ST.roster[t.kelas] = []; layarIsi(); });
  }
  layarIsi();
}

function kirimTugas(id) {
  var t = ST.tugas.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  var p = el('pesan-' + id);
  var tautan = el('tautan-' + id);
  var catatan = el('catatan-' + id);
  var link = tautan ? String(tautan.value || '').trim() : '';
  var isi = catatan ? String(catatan.value || '').trim() : '';
  if (!link && !isi) {
    p.innerHTML = '<div class="galat"><b>Belum ada yang dikirim</b>'
      + 'Isi tautan hasil kerjamu, atau tulis catatan untuk gurumu.</div>';
    return;
  }
  if (link && !/^https?:\/\//i.test(link)) {
    p.innerHTML = '<div class="galat"><b>Tautannya belum lengkap</b>'
      + 'Tautan harus diawali https:// — salin lagi dari Canva atau Drive.</div>';
    return;
  }
  var anggota = [].slice.call(document.querySelectorAll('[data-anggota="' + id + '"]'))
    .filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
  var kotakAnggota = el('anggota-' + id);
  if (!anggota.length && kotakAnggota) {
    anggota = String(kotakAnggota.value || '').split(/\s*,\s*/).filter(Boolean);
  }
  var b = document.querySelector('[data-kirim="' + id + '"]');
  if (b) { b.disabled = true; b.textContent = 'Mengirim…'; }
  panggil('studentSubmit', {
    taskId: id, studentName: ST.data.nama, link: link, content: isi,
    members: anggota
  }).then(function (j) {
    ST.buka = '';
    return muat(ST.nomor).then(function () {
      layarIsi();
      var tandai = document.querySelector('.tugas[data-id="' + id + '"]');
      if (tandai) tandai.scrollIntoView({ block: 'center' });
      pesanAtas(j.group
        ? 'Terkumpul untuk ' + (j.members || []).length + ' orang: ' + (j.members || []).join(', ')
        : 'Tugas "' + (j.task || t.judul) + '" sudah terkumpul.');
    });
  }, function (e) {
    if (b) { b.disabled = false; b.textContent = t.sudah ? 'Kirim ulang' : 'Kumpulkan'; }
    var q = el('pesan-' + id);
    if (q) q.innerHTML = '<div class="galat"><b>Belum terkirim</b>' + esc(e.message || e) + '</div>';
  });
}

function pesanAtas(teks) {
  var k = el('kabar');
  if (!k) return;
  k.innerHTML = '<div class="kabar-ok" role="status">' + esc(teks) + '</div>';
  k.scrollIntoView({ block: 'nearest' });
}

function layarIsi() {
  var d = ST.data;
  if (!d) { layarMasuk(''); return; }
  var g = perMapel(d);
  var semuaTugas = ST.tugas || [];
  var belum = semuaTugas.filter(function (t) { return !t.sudah; });
  var sudah = semuaTugas.filter(function (t) { return t.sudah; });
  belum.sort(function (a, b) { return String(a.batas || '9999').localeCompare(String(b.batas || '9999')); });
  sudah.sort(function (a, b) { return String(b.tanggal || '').localeCompare(String(a.tanggal || '')); });
  var rk = d.ringkas || {};

  var s = '<div class="kepala"><h1>' + esc(d.nama || '') + '</h1>'
    + '<button class="tombol sunyi" id="btn-keluar">Keluar</button></div>'
    + '<p class="identitas">' + esc((d.kelas || []).join(' · '))
    + (d.nis ? ' &nbsp;·&nbsp; NIS <b>' + esc(d.nis) + '</b>' : '')
    + (d.nisn ? ' &nbsp;·&nbsp; NISN <b>' + esc(d.nisn) + '</b>' : '')
    + '</p><div id="kabar"></div>';

  /* 1. nilai per jenis kelas — yang paling dicari */
  s += '<h2 class="bagian">Nilaiku per mata pelajaran</h2>';
  s += g.length ? g.map(blokMapel).join('')
    : '<div class="mapel"><div class="tanpa" style="margin:0">Belum ada nilai maupun tugas yang tercatat untukmu.</div></div>';

  /* 2. yang belum dikumpulkan — paling mendesak */
  if (belum.length) {
    s += '<h2 class="bagian">Belum kamu kumpulkan (' + belum.length + ')</h2>'
      + belum.map(barisTugas).join('');
  } else if (semuaTugas.length) {
    s += '<h2 class="bagian">Belum kamu kumpulkan</h2>'
      + '<div class="mapel"><div class="tanpa" style="margin:0">Tidak ada. Semua tugasmu sudah terkumpul.</div></div>';
  }

  /* 3. absensi */
  s += '<h2 class="bagian">Absensiku</h2><div class="absen-ring">'
    + '<div><small>Hadir</small><b>' + (rk.hadir || 0) + ' / ' + (rk.absenTercatat || 0) + '</b></div>'
    + (rk.persenHadir !== null && rk.persenHadir !== undefined
      ? '<div><small>Persen kehadiran</small><b>' + angka(rk.persenHadir) + '%</b></div>' : '')
    + '</div>';
  var absen = [];
  (d.kelas || []).forEach(function (k) {
    var r = ST.rinci[k];
    if (r && r.absen) r.absen.forEach(function (a) { absen.push({ k: k, a: a }); });
  });
  absen.sort(function (x, y) { return String(y.a.date).localeCompare(String(x.a.date)); });
  if (absen.length) {
    s += '<table class="absen"><tbody>' + absen.slice(0, 30).map(function (x) {
      return '<tr><td>' + tgl(x.a.date) + '</td><td class="st-' + esc(x.a.status) + '">'
        + esc(x.a.status || '-') + '</td></tr>';
    }).join('') + '</tbody></table>';
    if (absen.length > 30) {
      s += '<p class="kaki" style="text-align:left;margin-top:8px">Menampilkan 30 terbaru dari '
        + absen.length + ' pertemuan.</p>';
    }
  } else {
    s += '<div class="mapel"><div class="tanpa" style="margin:0">Belum ada pertemuan yang diabsen.</div></div>';
  }

  /* 4. pengumuman */
  var um = d.pengumuman || [];
  if (um.length) {
    s += '<h2 class="bagian">Pengumuman & jadwal ujian</h2>' + um.map(function (x) {
      return '<div class="umum"><div class="atas"><div class="j">' + esc(x.judul || '') + '</div>'
        + '<span class="cap jade">' + esc(x.jenis || '') + '</span></div>'
        + '<div class="t">' + tgl(x.tanggal) + (x.jam ? ' · ' + esc(x.jam) : '')
        + ' &nbsp;·&nbsp; ' + esc(x.mapel || x.kelas || '') + '</div>'
        + (x.isi ? '<div class="i">' + esc(x.isi) + '</div>' : '')
        + '</div>';
    }).join('');
  }

  /* 5. tugas yang sudah dikumpulkan */
  if (sudah.length) {
    s += '<h2 class="bagian">Sudah kamu kumpulkan (' + sudah.length + ')</h2>'
      + sudah.map(barisTugas).join('');
  }

  /* 6. email, supaya pemberitahuan sampai ke HP sendiri */
  s += '<h2 class="bagian">Emailku</h2><div class="akun">'
    + '<p>Sematkan emailmu supaya pemberitahuan tugas, ulangan, dan ujian dari gurumu '
    + 'langsung masuk ke email dan Google Calendar-mu.</p>'
    + '<label for="email">Alamat email</label>'
    + '<input type="email" id="email" autocomplete="email" placeholder="namamu@gmail.com" value="'
    + esc(d.email || '') + '">'
    + '<button class="tombol" id="btn-email">Simpan email</button>'
    + '<div id="email-pesan"></div></div>';

  el('layar').innerHTML = s;
  el('kaki').textContent = 'Halaman ini hanya menampilkan datamu sendiri.';
  el('btn-keluar').addEventListener('click', function () {
    lupakan(); ST.data = null; ST.rinci = {}; ST.tugas = []; ST.buka = ''; layarMasuk('');
  });
  el('btn-email').addEventListener('click', simpanEmail);

  /* Tombol pengumpulan dipasang sekali di sini, sesudah seluruh layar
     digambar ulang — bukan satu per satu saat merangkai HTML-nya. */
  [].slice.call(document.querySelectorAll('[data-buka]')).forEach(function (b) {
    b.addEventListener('click', function () { bukaBorang(b.getAttribute('data-buka')); });
  });
  [].slice.call(document.querySelectorAll('[data-kirim]')).forEach(function (b) {
    b.addEventListener('click', function () { kirimTugas(b.getAttribute('data-kirim')); });
  });
  var fokus = ST.buka && el('tautan-' + ST.buka);
  if (fokus) fokus.focus();
}

function simpanEmail() {
  var i = el('email');
  var v = i ? String(i.value || '').trim() : '';
  var p = el('email-pesan');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) {
    p.innerHTML = '<div class="galat"><b>Alamatnya belum benar</b>Contoh yang benar: namamu@gmail.com</div>';
    return;
  }
  var b = el('btn-email');
  b.disabled = true; b.textContent = 'Menyimpan…';
  panggil('siswaEmailSimpan', { nomor: ST.nomor, email: v }).then(function () {
    return muat(ST.nomor);
  }).then(function () {
    layarIsi();
    var q = el('email-pesan');
    if (q) q.innerHTML = '<div class="galat" style="background:var(--jade-muda);color:var(--jade-tua)">'
      + '<b>Tersimpan</b>Pemberitahuan dari gurumu akan dikirim ke alamat itu.</div>';
  }, function (e) {
    b.disabled = false; b.textContent = 'Simpan email';
    p.innerHTML = '<div class="galat"><b>Gagal menyimpan</b>' + esc(e.message || e) + '</div>';
  });
}

/* --- mulai ------------------------------------------------------- */
(function () {
  var n = diingat();
  if (!n) { layarMasuk(''); return; }
  el('layar').innerHTML = '<div class="memuat">Memuat berandamu…</div>';
  muat(n).then(layarIsi, function (e) { lupakan(); layarMasuk(e.message || String(e)); });
})();
</script>
</body>
</html>
