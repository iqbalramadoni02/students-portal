<script>
/* ---------------------------------------------------------------
 * Sambungan. Alamat /exec ditanam supaya siswa tidak perlu
 * mengetik apa pun. TIDAK ada API key di berkas ini.
 * ------------------------------------------------------------- */
var API = (function () {
  var bawaan = 'https://script.google.com/macros/s/AKfycbyV8s3_yYClutUiPfF7Jam_Tww6QFJkoZKABIFBEvEV_jdR6fRASdixXHGxjj043WDsJw/exec';
  /* Alamat lain hanya diterima kalau jelas-jelas mesin lokal. Itu pintu untuk
     pengujian otomatis; tautan yang disebar ke siswa TIDAK bisa dibelokkan ke
     server orang lain lewat ?api=, jadi nomor induk mereka tidak bisa dipanen. */
  try {
    var q = new URLSearchParams(location.search).get('api') || '';
    if (/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(q)) return q;
  } catch (e) { }
  return bawaan;
})();
var SIMPAN = 'beranda.nis';

function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
function tgl(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  if (!m) return String(s || '');
  return Number(m[3]) + ' ' + BLN[Number(m[2]) - 1] + ' ' + m[1];
}
function hariIni() { return new Date().toISOString().slice(0, 10); }
function angka(n) {
  if (n === null || n === undefined || n === '') return '';
  var x = Number(n);
  if (isNaN(x)) return String(n);
  return (Math.round(x * 10) / 10).toString().replace('.', ',');
}

/* Satu pintu ke server. Dipanggil TANPA key — aksi siswa dilayani
   sebelum pemeriksaan key, dan kalau server ternyata lebih lama,
   pesannya menjelaskan apa yang harus dilakukan. */
function panggil(action, payload) {
  var body = Object.assign({ action: action }, payload || {});
  return fetch(API, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.text(); }).then(function (t) {
    var j;
    try { j = JSON.parse(t); } catch (e) {
      throw new Error('Jawaban server tidak terbaca. Pastikan alamat /exec sudah di-deploy dengan akses "Anyone".');
    }
    if (!j.ok) {
      var m = String(j.error || 'Permintaan gagal.');
      if (/aksi tidak dikenal/i.test(m)) {
        throw new Error('Fitur ini belum ada di sistem yang sedang berjalan. '
          + 'Hubungi Ustadz: Code.gs perlu ditempel ulang lalu Deploy → Versi baru.');
      }
      throw new Error(m);
    }
    return j;
  }, function () {
    throw new Error('Tidak dapat menghubungi server. Periksa sambungan internetmu, lalu coba lagi.');
  });
}

var ST = { nomor: '', data: null, rinci: {}, sibuk: false, tugas: [], buka: '', roster: {},
  semuaMateri: false,
  /* tab yang sedang dibuka; sidebar terlipat di layar lebar; laci terbuka di HP */
  tab: 'beranda', sisiTutup: false, laciBuka: false,
  /* keadaan absen hari ini, dibaca dari server sekali per sesi */
  absen: null, absenMinta: false,
  /* materi mana yang sedang dibuka; tersimpan supaya tidak menutup
     sendiri setiap kali layarnya digambar ulang */
  materiBuka: {} };

/** Tanggal + jam dari cap waktu milidetik (dipakai jadwal ujian CBT). */
function waktuTeks(ms) {
  var n = Number(ms);
  if (!n || !isFinite(n)) return '';
  var d = new Date(n);
  if (isNaN(d.getTime())) return '';
  var j = ('0' + d.getHours()).slice(-2) + '.' + ('0' + d.getMinutes()).slice(-2);
  return d.getDate() + ' ' + BLN[d.getMonth()] + ' ' + d.getFullYear() + ' pukul ' + j;
}

function ingat(n) { try { sessionStorage.setItem(SIMPAN, n); } catch (e) { } }
function diingat() { try { return sessionStorage.getItem(SIMPAN) || ''; } catch (e) { return ''; } }
function lupakan() { try { sessionStorage.removeItem(SIMPAN); } catch (e) { } }

/* ---------------------------------------------------------------
 * LAYAR MASUK
 * ------------------------------------------------------------- */
function layarMasuk(pesan) {
  el('layar').innerHTML = '<div class="masuk">'
    + '<h1>Masuk dengan Nomor Induk</h1>'
    + '<p>Ketik NIS atau NISN-mu. Tidak perlu memilih kelas dan nama — yang muncul hanya milikmu sendiri.</p>'
    + '<label for="nis">Nomor Induk (NIS / NISN)</label>'
    + '<input type="text" id="nis" inputmode="numeric" autocomplete="off" '
    + 'enterkeyhint="go" placeholder="contoh: 252610001">'
    + '<button class="tombol" id="btn-masuk">Lihat berandaku</button>'
    + (pesan ? '<div class="galat" role="alert"><b>Belum bisa masuk</b>' + esc(pesan) + '</div>' : '')
    + '</div>';
  el('kaki').textContent = 'Kalau nomor indukmu belum terdaftar, hubungi gurumu.';
  var i = el('nis');
  el('btn-masuk').addEventListener('click', masuk);
  i.addEventListener('keydown', function (e) { if (e.key === 'Enter') masuk(); });
  i.focus();
}

function masuk() {
  var i = el('nis');
  var n = i ? String(i.value || '').trim() : '';
  if (!n) { layarMasuk('Nomor induknya diisi dulu.'); return; }
  if (ST.sibuk) return;
  ST.sibuk = true;
  var b = el('btn-masuk');
  if (b) { b.disabled = true; b.textContent = 'Mencari datamu…'; }
  muat(n).then(function () {
    ST.sibuk = false;
    ingat(n);
    layarIsi();
  }, function (e) {
    ST.sibuk = false;
    layarMasuk(e.message || String(e));
  });
}

function muat(n) {
  return panggil('siswaRingkas', { nomor: n }).then(function (j) {
    ST.nomor = n;
    ST.data = j;
    /* Rincian per kelas diambil terpisah: dari situ datang tanggal
       absensi dan skala huruf milik sekolah. Kalau gagal, beranda
       tetap tampil — hanya rinciannya yang tidak ada. */
    var kelas = j.kelas || [];
    return Promise.all(kelas.map(function (k) {
      return panggil('studentRecap', { className: k, studentName: j.nama })
        .then(function (r) { ST.rinci[k] = r; }, function () { ST.rinci[k] = null; });
    })).then(function () { ST.tugas = daftarTugas(j); return j; });
  });
}

/* ---------------------------------------------------------------
 * Satu daftar tugas untuk seluruh halaman. Sumber utamanya
 * studentRecap, karena hanya di sana ada id tugas — dan tanpa id,
 * tugas tidak bisa dikumpulkan. Kalau rincian itu tidak bisa
 * diambil (server lebih lama), daftarnya jatuh ke siswaRingkas:
 * tugasnya tetap terlihat, hanya tidak bisa dikumpulkan dari sini.
 * ------------------------------------------------------------- */
function daftarTugas(d) {
  var out = [], ada = {};
  (d.kelas || []).forEach(function (k) {
    var r = ST.rinci[k];
    if (!r || !r.tugas) return;
    r.tugas.forEach(function (t) {
      ada[(k + '|' + String(t.title || '')).toUpperCase()] = 1;
      out.push({
        id: t.id, judul: t.title, mapel: t.subject || '', kelas: k,
        batas: t.dueDate || '', sudah: !!t.submitted, tanggal: String(t.submittedAt || '').slice(0, 10),
        nilai: (t.score === '' || t.score === null || t.score === undefined) ? null : t.score,
        maxScore: t.maxScore, status: t.status || '', tutup: String(t.status || '') === 'Tutup',
        mode: t.mode || '', groupMin: t.groupMin || '', groupMax: t.groupMax || '',
        petunjuk: t.instruction || '', anggota: t.members || '', kelompokNama: t.groupName || '',
        /* Dibawa apa adanya dari form tugas gurunya: jenis, tanggal
           diberikan, dan tautan bahan. Tautan itu menempel pada tugasnya —
           terlihat di daftar maupun di borang pengumpulan, sebelum dan
           sesudah dikumpulkan. */
        jenis: t.type || '', diberikan: t.assignDate || '', link: t.link || '',
        kirimanLink: t.submissionLink || ''
      });
    });
  });
  /* Tugas yang hanya muncul di ringkasan tetap ditampilkan, supaya tidak
     ada yang hilang dari layar hanya karena rinciannya gagal diambil. */
  (d.perKelas || []).forEach(function (pk) {
    (pk.tugas || []).forEach(function (t) {
      if (ada[(pk.kelas + '|' + String(t.judul || '')).toUpperCase()]) return;
      out.push({
        id: t.id || '', judul: t.judul, mapel: t.mapel || '', kelas: pk.kelas,
        batas: t.batas || '', sudah: !!t.sudah, tanggal: t.tanggal || '',
        nilai: (t.nilai === '' || t.nilai === null || t.nilai === undefined) ? null : t.nilai,
        maxScore: t.maxScore, status: t.status || '', tutup: !!t.tutup,
        mode: t.mode || '', groupMin: t.groupMin || '', groupMax: t.groupMax || '',
        petunjuk: t.petunjuk || '', anggota: '', kelompokNama: '',
        jenis: t.jenis || '', diberikan: t.diberikan || '', link: t.link || '',
        kirimanLink: ''
      });
    });
  });
  return out;
}

/* ---------------------------------------------------------------
 * Nilai dikelompokkan per JENIS KELAS (mata pelajaran), karena
 * satu rombel bisa diampu dua mapel sekaligus — English Wajib dan
 * English Lanjut di XI 2, misalnya.
 * ------------------------------------------------------------- */
function perMapel(d) {
  var peta = {};
  function ambil(mapel, kelas) {
    var k = mapel + '|' + kelas;
    if (!peta[k]) peta[k] = { mapel: mapel, kelas: kelas, nilai: [], tugas: [] };
    return peta[k];
  }
  (d.perKelas || []).forEach(function (pk) {
    (pk.nilai || []).forEach(function (n) {
      ambil(n.mapel || 'Tanpa mata pelajaran', pk.kelas).nilai.push(n);
    });
    (pk.tugas || []).forEach(function (t) {
      ambil(t.mapel || 'Tanpa mata pelajaran', pk.kelas).tugas.push(t);
    });
  });
  return Object.keys(peta).sort().map(function (k) { return peta[k]; });
}

function rata(nilai) {
  var n = 0, j = 0;
  nilai.forEach(function (x) {
    var v = Number(x.nilai), m = Number(x.maks) > 0 ? Number(x.maks) : 100;
    if (!isNaN(v)) { j += (v / m) * 100; n++; }
  });
  return n ? { rata: j / n, n: n } : null;
}

/* Huruf memakai skala milik sekolah kalau servernya mengirimkannya. */
function huruf(kelas, nilai100) {
  var r = ST.rinci[kelas];
  var skala = r && r.rapor && r.rapor.skala;
  if (!skala || !skala.length) return '';
  for (var i = 0; i < skala.length; i++) {
    if (nilai100 >= Number(skala[i].min)) return String(skala[i].l);
  }
  return String(skala[skala.length - 1].l || '');
}

function blokMapel(g) {
  var r = rata(g.nilai);
  var h = r ? huruf(g.kelas, r.rata) : '';
  var sudah = g.tugas.filter(function (t) { return t.sudah; }).length;
  var s = '<div class="mapel"><div class="atas">'
    + '<div><div class="nm">' + esc(g.mapel) + '</div>'
    + '<div class="sub">' + esc(g.kelas)
    + (r ? ' · ' + r.n + ' butir nilai' : '') + '</div></div>'
    + (r ? '<div class="angka">' + angka(r.rata) + '</div>' : '')
    + (h ? '<div class="huruf">' + esc(h) + '</div>' : '')
    + '</div>';
  if (g.nilai.length) {
    s += '<div class="butir">' + g.nilai.map(function (n) {
      return '<div>' + esc(n.komponen || '—') + ' <b>' + angka(n.nilai) + '</b></div>';
    }).join('') + '</div>';
  } else {
    s += '<div class="tanpa">Belum ada nilai yang keluar untuk mata pelajaran ini.</div>';
  }
  if (g.tugas.length) {
    s += '<div class="sub" style="margin-top:12px">Tugas: ' + sudah + ' dari '
      + g.tugas.length + ' sudah dikumpulkan</div>';
  }
  return s + '</div>';
}

/* ---------------------------------------------------------------
 * Alamat yang benar-benar bisa dibuka. Kolom "Tautan bahan" di form
 * tugas bertipe url, tetapi tugas lama bisa berisi keterangan biasa
 * ("lihat buku paket hal. 42"). Yang bukan alamat ditampilkan sebagai
 * teks — bukan tombol yang menjanjikan sesuatu lalu gagal dibuka.
 * ------------------------------------------------------------- */
function alamat(u) {
  var s = String(u || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return s;
  if (s.indexOf(' ') < 0 && /^[\w-]+(\.[\w-]+)+([/?#]|$)/.test(s)) return 'https://' + s;
  return '';
}

/* Tautan bahan yang MENEMPEL pada tugasnya: ikut terlihat di daftar
   tugas, di borang pengumpulan, dan tetap ada sesudah dikumpulkan. */
function bahanTugas(t, dalamBorang) {
  var s = String(t.link || '').trim();
  if (!s) return '';
  var u = alamat(s);
  if (!u) {
    return '<div class="bahan-teks">Bahan dari gurumu: <b>' + esc(s) + '</b></div>';
  }
  return '<a class="tombol sunyi bahan" target="_blank" rel="noopener noreferrer" href="'
    + esc(u) + '">' + (dalamBorang ? 'Buka bahan tugasnya' : 'Buka bahan tugas') + '</a>';
}

/* ---------------------------------------------------------------
 * MATERI & CATATAN PEMBELAJARAN — bahan yang ditempel gurunya di
 * tiap pertemuan. Form "Materi / presentasi" di sisi guru sudah lama
 * menjanjikan "siswa melihatnya di riwayat pembelajaran mereka",
 * padahal halaman ini belum pernah menggambarnya sekali pun.
 * ------------------------------------------------------------- */
function blokMateri(d) {
  var m = d.materi || [];
  if (!m.length) {
    return '<div class="mapel"><div class="tanpa" style="margin:0">Belum ada materi '
      + 'atau bahan belajar yang dibagikan gurumu.</div></div>';
  }
  var batas = ST.semuaMateri ? m.length : 6;
  var s = m.slice(0, batas).map(function (x) {
    var kepala = [];
    if (x.mapel) kepala.push(esc(x.mapel));
    if (x.no) kepala.push('pertemuan ' + esc(String(x.no)));
    if (x.tp) kepala.push('TP ' + esc(x.tp));
    var b = '<div class="materi"><div class="atas"><div class="j">'
      + esc(x.topik || x.materi || ('Pertemuan ' + (x.no || ''))) + '</div>'
      + (x.tanggal ? '<span class="cap jade">' + tgl(x.tanggal) + '</span>' : '')
      + '</div>'
      + (kepala.length ? '<div class="t">' + kepala.join(' &nbsp;·&nbsp; ') + '</div>' : '');
    var dl = '';
    if (x.materi && x.materi !== x.topik) dl += '<dt>Materi</dt><dd>' + esc(x.materi) + '</dd>';
    if (x.media) dl += '<dt>Media</dt><dd>' + esc(x.media) + '</dd>';
    if (x.penugasan) dl += '<dt>Penugasan</dt><dd>' + esc(x.penugasan) + '</dd>';
    if (dl) b += '<dl>' + dl + '</dl>';
    var t = (x.tautan || []).filter(function (l) { return alamat(l.url); });
    if (t.length) {
      b += '<div class="bahan-daftar">' + t.map(function (l) {
        return '<a target="_blank" rel="noopener noreferrer" href="' + esc(alamat(l.url)) + '">'
          + '<i aria-hidden="true">↗</i>' + esc(l.nama || 'Buka bahan') + '</a>';
      }).join('') + '</div>';
    }
    return b + '</div>';
  }).join('');
  if (m.length > batas) {
    s += '<button class="tombol sunyi" id="btn-materi" style="width:auto">Tampilkan '
      + (m.length - batas) + ' pertemuan lainnya</button>';
  }
  return s;
}

/* ---------------------------------------------------------------
 * UJIAN CBT — hanya ada kalau halaman ini dilayani script gabungan
 * (MPH + CBT). Tokennya TIDAK ditampilkan di sini: itu tetap milik
 * guru untuk dibagikan saat ujiannya dimulai.
 * ------------------------------------------------------------- */
function blokCbt(d) {
  var c = d.cbt;
  if (!c || c.ada === false) return '';
  var daftar = c.ujian || [];
  var s = daftar.length ? daftar.map(function (x) {
    var bagian = [];
    if (x.mapel) bagian.push(esc(x.mapel));
    if (x.kategori) bagian.push(esc(x.kategori));
    var w = waktuTeks(x.mulai);
    if (w) bagian.push(w);
    if (x.durasi) bagian.push(x.durasi + ' menit');
    if (x.kkm !== null && x.kkm !== undefined) bagian.push('KKM ' + angka(x.kkm));
    var cap;
    if (x.nilai !== null && x.nilai !== undefined) cap = '<span class="n">' + angka(x.nilai) + '</span>';
    else if (x.sudah) cap = '<span class="cap jade">Sudah dikerjakan</span>';
    else if (x.fase === 'berlangsung') cap = '<span class="cap jade">Sedang dibuka</span>';
    else if (x.fase === 'akan') cap = '<span class="cap emas">Belum dibuka</span>';
    else cap = '<span class="cap merah">Terlewat</span>';
    return '<div class="ujian ' + esc(x.fase || '') + '"><div class="baris"><div class="isi">'
      + '<div class="j">' + esc(x.judul || '(tanpa judul)') + '</div>'
      + '<div class="k">' + bagian.join(' · ') + '</div></div>' + cap + '</div></div>';
  }).join('')
    : '<div class="mapel"><div class="tanpa" style="margin:0">Belum ada ujian CBT '
      + 'yang dijadwalkan untuk kelasmu.</div></div>';
  var u = alamat(c.portal);
  if (u) {
    s += '<div class="akun" style="margin-top:9px">'
      + '<p>Masuk ke portal ujian dengan NISN-mu dan token yang diberikan gurumu saat '
      + 'ujian dimulai. Token tidak ditampilkan di halaman ini.</p>'
      + '<a class="tombol" target="_blank" rel="noopener noreferrer" href="' + esc(u) + '">'
      + 'Buka portal ujian CBT</a></div>';
  }
  return s;
}

function barisTugas(t) {
  var lewat = !t.sudah && t.batas && String(t.batas) < hariIni();
  var kelas = t.sudah ? 'sudah' : (lewat ? 'lewat' : 'belum');
  var cap = t.sudah
    ? (t.nilai === null || t.nilai === undefined || t.nilai === ''
      ? '<span class="cap jade">Sudah dikumpulkan</span>'
      : '<span class="n">' + angka(t.nilai) + '</span>')
    : (lewat ? '<span class="cap merah">Lewat batas</span>'
      : '<span class="cap emas">Belum</span>');
  /* Keterangannya mengikuti format penugasan gurunya: jenis, mata
     pelajaran, rentang tanggal, nilai maksimum, dan cara pengerjaan. */
  var bagian = [];
  if (t.jenis) bagian.push(esc(t.jenis));
  if (t.mapel) bagian.push(esc(t.mapel));
  if (t.diberikan && t.batas) bagian.push(tgl(t.diberikan) + ' → ' + tgl(t.batas));
  else if (t.batas) bagian.push('batas ' + tgl(t.batas));
  if (t.maxScore) bagian.push('nilai maks ' + angka(t.maxScore));
  if (t.mode === 'kelompok') bagian.push('tugas kelompok');
  if (t.sudah && t.tanggal) bagian.push('dikumpulkan ' + tgl(t.tanggal));
  var kiriman = '';
  if (t.sudah && alamat(t.kirimanLink)) {
    kiriman = '<a class="tombol sunyi kiriman" target="_blank" rel="noopener noreferrer" href="'
      + esc(alamat(t.kirimanLink)) + '">Lihat yang kamu kirim</a>';
  }
  /* Borangnya diletakkan DI BAWAH baris, bukan di dalam kolom kirinya:
     di dalam flex, lebarnya tinggal separuh dan kotak tautan terpotong. */
  return '<div class="tugas ' + kelas + '" data-id="' + esc(t.id || '') + '">'
    + '<div class="baris"><div class="isi">'
    + '<div class="j">' + esc(t.judul || '(tanpa judul)') + '</div>'
    + '<div class="k">' + bagian.join(' · ') + '</div></div>' + cap + '</div>'
    + (bahanTugas(t) || kiriman
      ? '<div class="tombol-baris">' + bahanTugas(t) + kiriman + '</div>' : '')
    + tombolKumpul(t) + '</div>';
}

/* ---------------------------------------------------------------
 * PENGUMPULAN TUGAS — beranda ini juga tempat mengumpulkan, bukan
 * hanya melihat. Butuh id tugas, jadi hanya muncul kalau rincian
 * kelasnya berhasil diambil.
 * ------------------------------------------------------------- */
function tombolKumpul(t) {
  if (!t.id) return '';
  if (t.tutup) return '<div class="k" style="margin-top:6px">Pengumpulan sudah ditutup gurumu.</div>';
  var terbuka = ST.buka === t.id;
  var label = t.sudah ? 'Kumpulkan ulang' : 'Kumpulkan sekarang';
  return '<button class="tombol sunyi kumpul" data-buka="' + esc(t.id) + '" style="margin-top:9px">'
    + (terbuka ? 'Tutup' : label) + '</button>'
    + (terbuka ? borang(t) : '');
}

function borang(t) {
  var kelompok = String(t.mode || '') === 'kelompok';
  var daftar = ST.roster[t.kelas];
  var s = '<div class="borang" data-borang="' + esc(t.id) + '">';
  if (t.petunjuk) s += '<div class="petunjuk">' + esc(t.petunjuk) + '</div>';
  /* Bahannya diulang di sini supaya tidak perlu menutup borang hanya untuk
     membuka tautannya lagi saat sedang mengerjakan. */
  var bahan = bahanTugas(t, true);
  if (bahan) s += '<div class="tombol-baris" style="margin-bottom:13px">' + bahan + '</div>';
  s += '<label for="tautan-' + esc(t.id) + '">Tautan hasil kerjamu</label>'
    + '<input type="text" id="tautan-' + esc(t.id) + '" inputmode="url" '
    + 'placeholder="https://… (Canva, Drive, Docs)" autocomplete="off">'
    + '<label for="catatan-' + esc(t.id) + '" style="margin-top:12px">Catatan untuk guru (boleh dikosongkan)</label>'
    + '<textarea id="catatan-' + esc(t.id) + '" rows="3" '
    + 'placeholder="misalnya: bagian yang masih kurang, atau kendala saat mengerjakan"></textarea>';
  if (kelompok) {
    s += '<label style="margin-top:12px">Anggota kelompok'
      + (t.groupMin || t.groupMax
        ? ' <span style="font-weight:400;color:var(--tinta-3)">('
          + (t.groupMin ? 'minimal ' + t.groupMin : '')
          + (t.groupMin && t.groupMax ? ', ' : '')
          + (t.groupMax ? 'maksimal ' + t.groupMax : '') + ' orang, termasuk kamu)</span>'
        : '') + '</label>';
    if (daftar === undefined) {
      s += '<div class="k">Memuat daftar teman sekelas…</div>';
    } else if (!daftar || !daftar.length) {
      s += '<div class="k">Daftar kelas tidak bisa dimuat. Tulis nama anggotanya dipisah koma.</div>'
        + '<input type="text" id="anggota-' + esc(t.id) + '" placeholder="Nama 1, Nama 2">';
    } else {
      s += '<div class="anggota">' + daftar.filter(function (n) {
        return String(n).toUpperCase() !== String(ST.data.nama || '').toUpperCase();
      }).map(function (n, i) {
        return '<label class="pilih"><input type="checkbox" value="' + esc(n)
          + '" data-anggota="' + esc(t.id) + '"> ' + esc(n) + '</label>';
      }).join('') + '</div>';
    }
  }
  s += '<div id="pesan-' + esc(t.id) + '"></div>'
    + '<button class="tombol" data-kirim="' + esc(t.id) + '">'
    + (t.sudah ? 'Kirim ulang' : 'Kumpulkan') + '</button>';
  if (t.sudah) {
    s += '<div class="k" style="margin-top:9px">Kiriman lamamu tidak dibuang — '
      + 'disimpan di bawah kiriman yang baru.</div>';
  }
  return s + '</div>';
}

function bukaBorang(id) {
  var t = ST.tugas.filter(function (x) { return x.id === id; })[0];
  ST.buka = (ST.buka === id) ? '' : id;
  if (ST.buka && t && String(t.mode || '') === 'kelompok' && ST.roster[t.kelas] === undefined) {
    ST.roster[t.kelas] = undefined;
    panggil('studentRoster', { className: t.kelas }).then(function (j) {
      var r = j.roster || j.names || j.data || [];
      ST.roster[t.kelas] = r.map(function (x) {
        return typeof x === 'string' ? x : String(x.name || x.nama || '');
      }).filter(Boolean);
      layarIsi();
    }, function () { ST.roster[t.kelas] = []; layarIsi(); });
  }
  layarIsi();
}

function kirimTugas(id) {
  var t = ST.tugas.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  var p = el('pesan-' + id);
  var tautan = el('tautan-' + id);
  var catatan = el('catatan-' + id);
  var link = tautan ? String(tautan.value || '').trim() : '';
  var isi = catatan ? String(catatan.value || '').trim() : '';
  if (!link && !isi) {
    p.innerHTML = '<div class="galat"><b>Belum ada yang dikirim</b>'
      + 'Isi tautan hasil kerjamu, atau tulis catatan untuk gurumu.</div>';
    return;
  }
  if (link && !/^https?:\/\//i.test(link)) {
    p.innerHTML = '<div class="galat"><b>Tautannya belum lengkap</b>'
      + 'Tautan harus diawali https:// — salin lagi dari Canva atau Drive.</div>';
    return;
  }
  var anggota = [].slice.call(document.querySelectorAll('[data-anggota="' + id + '"]'))
    .filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
  var kotakAnggota = el('anggota-' + id);
  if (!anggota.length && kotakAnggota) {
    anggota = String(kotakAnggota.value || '').split(/\s*,\s*/).filter(Boolean);
  }
  var b = document.querySelector('[data-kirim="' + id + '"]');
  if (b) { b.disabled = true; b.textContent = 'Mengirim…'; }
  panggil('studentSubmit', {
    taskId: id, studentName: ST.data.nama, link: link, content: isi,
    members: anggota
  }).then(function (j) {
    ST.buka = '';
    return muat(ST.nomor).then(function () {
      layarIsi();
      var tandai = document.querySelector('.tugas[data-id="' + id + '"]');
      if (tandai) tandai.scrollIntoView({ block: 'center' });
      pesanAtas(j.group
        ? 'Terkumpul untuk ' + (j.members || []).length + ' orang: ' + (j.members || []).join(', ')
        : 'Tugas "' + (j.task || t.judul) + '" sudah terkumpul.');
      /* Bukti digital ditempel tepat di kartu tugasnya, bukan di pesan atas,
         supaya tetap terbaca saat siswa menggulir untuk memeriksa. */
      var kotakBukti = document.querySelector('.tugas[data-id="' + id + '"] .borang')
        || document.querySelector('.tugas[data-id="' + id + '"]');
      if (kotakBukti) kotakBukti.insertAdjacentHTML('beforeend', kartuBukti(j, t));
    });
  }, function (e) {
    if (b) { b.disabled = false; b.textContent = t.sudah ? 'Kirim ulang' : 'Kumpulkan'; }
    var q = el('pesan-' + id);
    if (q) q.innerHTML = '<div class="galat"><b>Belum terkirim</b>' + esc(e.message || e) + '</div>';
  });
}

/* ---------------------------------------------------------------
 * GOOGLE CALENDAR
 * Dua jalan, dan keduanya perlu:
 *  - berlangganan sekali: setiap agenda BARU dari Ustadz muncul sendiri
 *    di kalender anak, selamanya, tanpa menunggu email;
 *  - tambah satu-satu: untuk yang ingin agendanya masuk SEKARANG juga,
 *    karena Google menyegarkan kalender langganan beberapa jam sekali.
 * ------------------------------------------------------------- */
function umpanKalender() {
  return API + (API.indexOf('?') >= 0 ? '&' : '?')
    + 'action=icsSiswa&nomor=' + encodeURIComponent(ST.nomor || '');
}

function tautanLangganan() {
  return 'https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(umpanKalender());
}

function capKal(tgl, jam, bawaan) {
  var t = String(tgl || '').replace(/-/g, '');
  var j = String(jam || '').replace(/[^0-9]/g, '').slice(0, 4);
  return t + 'T' + (j.length === 4 ? j : bawaan) + '00';
}

/** Tautan "tambahkan satu acara" bawaan Google — langsung terbuka berisi. */
function tautanSatuAcara(x) {
  var mulai = capKal(x.tanggal, x.jam, '0700');
  var akhir = capKal(x.tanggal, x.sampai || '', '0840');
  if (!(akhir > mulai)) akhir = capKal(x.tanggal, x.jam, '0840');
  var q = 'action=TEMPLATE'
    + '&text=' + encodeURIComponent((x.jenis ? x.jenis + ': ' : '') + (x.judul || ''))
    + '&dates=' + mulai + '/' + akhir
    + '&details=' + encodeURIComponent(String(x.isi || '') + (x.mapel ? '\n' + x.mapel : ''))
    + '&location=' + encodeURIComponent(x.kelas || '')
    + '&ctz=Asia/Jakarta';
  return 'https://calendar.google.com/calendar/render?' + q;
}

function kartuKalender(d) {
  var punyaEmail = !!String(d.email || '').trim();
  if (!punyaEmail) {
    return '<div class="akun"><p>Sematkan emailmu di bawah, lalu kartu '
      + '<b>Google Calendar</b> muncul di sini — sekali daftar, seluruh agenda '
      + 'dari gurumu masuk sendiri ke kalendermu.</p></div>';
  }
  return '<div class="akun">'
    + '<p>Emailmu sudah tersematkan: <b>' + esc(d.email) + '</b>. '
    + 'Daftarkan agendamu sekali, lalu <b>setiap ulangan, ujian, dan batas tugas '
    + 'yang baru dibuat gurumu masuk sendiri</b> ke Google Calendar — tidak perlu '
    + 'menambahkan satu per satu lagi.</p>'
    + '<a class="tombol" id="btn-kal" target="_blank" rel="noopener" href="'
    + esc(tautanLangganan()) + '">Hubungkan ke Google Calendar</a>'
    + '<p class="k" style="margin-top:11px">Di layar yang terbuka, tekan '
    + '<b>Tambahkan</b>. Google menyegarkan kalender langganan beberapa jam '
    + 'sekali, jadi agenda yang baru saja dibuat gurumu bisa belum langsung '
    + 'terlihat — untuk yang mendesak, pakai tombol <b>Tambah ke Calendar</b> '
    + 'pada pengumumannya.</p>'
    + '<label for="umpan" style="margin-top:13px">Alamat agendamu (untuk kalender selain Google)</label>'
    + '<input type="text" id="umpan" readonly value="' + esc(umpanKalender()) + '">'
    + '<button class="tombol sunyi" id="btn-salin" style="margin-top:9px">Salin alamat</button>'
    + '<div id="kal-pesan"></div></div>';
}

function pesanAtas(teks) {
  var k = el('kabar');
  if (!k) return;
  k.innerHTML = '<div class="kabar-ok" role="status">' + esc(teks) + '</div>';
  k.scrollIntoView({ block: 'nearest' });
}


/* ---------------------------------------------------------------
 * RADAR KEMAMPUAN BAHASA INGGRIS
 * Jaring laba-laba digambar sendiri dengan SVG — tanpa pustaka berat,
 * supaya beranda tetap ringan di HP siswa dan tetap terbaca saat
 * jaringan sekolah lambat.
 * ------------------------------------------------------------- */
var SKILL = ['Reading', 'Listening', 'Writing', 'Speaking', 'Grammar'];

/** Cocokkan komponen nilai apa pun ke salah satu dari lima kemampuan. */
function skillDari(teks) {
  var t = String(teks || '').toLowerCase();
  if (/read|baca/.test(t)) return 'Reading';
  if (/listen|simak|dengar/.test(t)) return 'Listening';
  if (/writ|tulis|essay|esai/.test(t)) return 'Writing';
  if (/speak|bicara|lisan|oral|present/.test(t)) return 'Speaking';
  if (/gram|struktur|tense|language focus/.test(t)) return 'Grammar';
  return '';
}

function nilaiSkill(d) {
  var kumpul = {};
  SKILL.forEach(function (k) { kumpul[k] = []; });
  (d.perKelas || []).forEach(function (pk) {
    (pk.nilai || []).forEach(function (n) {
      var k = skillDari(n.komponen) || skillDari(n.judul) || skillDari(n.jenis);
      if (!k) return;
      var v = Number(n.nilai), m = Number(n.maks) > 0 ? Number(n.maks) : 100;
      if (isNaN(v)) return;
      kumpul[k].push(Math.max(0, Math.min(100, (v / m) * 100)));
    });
  });
  var hasil = SKILL.map(function (k) {
    var a = kumpul[k];
    return { nama: k, n: a.length, nilai: a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null };
  });
  return hasil;
}

function kartuRadar(d) {
  var data = nilaiSkill(d);
  var ada = data.filter(function (x) { return x.nilai !== null; });
  var s = '<div class="radar"><h3>Radar kemampuanku</h3>'
    + '<p class="ket">Rata-rata nilaimu pada lima keterampilan. Yang paling pendek itulah yang paling perlu dilatih.</p>';
  if (ada.length < 3) {
    s += '<div class="tanpa">Radar muncul setelah ada nilai pada minimal tiga keterampilan '
      + '(Reading, Listening, Writing, Speaking, Grammar).</div></div>';
    return s;
  }
  /* Bingkainya dibuat cukup lebar untuk NAMA sumbunya, bukan hanya untuk
     jaringnya: label kanan ("Listening") ditulis mulai dari ujung sumbu,
     jadi kalau bingkainya pas-pasan hurufnya terpotong di tepi. */
  var R = 84, CX = 170, CY = 120, RL = R + 22;
  function titik(i, r) {
    var a = (Math.PI * 2 * i) / SKILL.length - Math.PI / 2;
    return [CX + Math.cos(a) * r, CY + Math.sin(a) * r];
  }
  var jaring = '';
  [0.25, 0.5, 0.75, 1].forEach(function (f) {
    var p = SKILL.map(function (_, i) { return titik(i, R * f).map(function (v) { return v.toFixed(1); }).join(','); }).join(' ');
    jaring += '<polygon class="jaring" points="' + p + '"></polygon>';
  });
  var sumbu = SKILL.map(function (_, i) {
    var t = titik(i, R);
    return '<line class="sumbu" x1="' + CX + '" y1="' + CY + '" x2="' + t[0].toFixed(1) + '" y2="' + t[1].toFixed(1) + '"></line>';
  }).join('');
  var simpul = data.map(function (x, i) { return titik(i, R * ((x.nilai === null ? 0 : x.nilai) / 100)); });
  var bidang = '<polygon class="bidang" points="'
    + simpul.map(function (t) { return t[0].toFixed(1) + ',' + t[1].toFixed(1); }).join(' ') + '"></polygon>';
  var bulat = simpul.map(function (t, i) {
    return data[i].nilai === null ? '' : '<circle class="titik" cx="' + t[0].toFixed(1) + '" cy="' + t[1].toFixed(1) + '" r="3"></circle>';
  }).join('');
  var label = data.map(function (x, i) {
    var t = titik(i, RL);
    var anchor = Math.abs(t[0] - CX) < 6 ? 'middle' : (t[0] > CX ? 'start' : 'end');
    var baris = '<text class="nama" x="' + t[0].toFixed(1) + '" y="' + t[1].toFixed(1) + '" text-anchor="' + anchor + '">' + esc(x.nama) + '</text>';
    baris += '<text class="nilai" x="' + t[0].toFixed(1) + '" y="' + (t[1] + 12).toFixed(1) + '" text-anchor="' + anchor + '">'
      + (x.nilai === null ? '—' : angka(x.nilai)) + '</text>';
    return baris;
  }).join('');
  s += '<svg viewBox="0 0 340 250" role="img" aria-label="Radar lima keterampilan bahasa Inggris">'
    + jaring + sumbu + bidang + bulat + label + '</svg></div>';
  return s;
}

/* ---------------------------------------------------------------
 * LENCANA PENCAPAIAN
 * Dihitung dari data yang memang sudah ada: kehadiran, ketepatan waktu
 * mengumpulkan, dan bintang. Tidak ada angka karangan.
 * ------------------------------------------------------------- */
/* Star Points bukan nilai ujian: ia poin perilaku berskala 600 yang dicatat
   sebagai komponen bernama "STAR POINTS". Yang dipakai capaian terbaru. */
var STAR_MAKS = 600;
function bintangDari(d) {
  var pilih = null;
  (d.perKelas || []).forEach(function (pk) {
    (pk.nilai || []).forEach(function (n) {
      if (String(n.komponen || '').toUpperCase().trim() !== 'STAR POINTS') return;
      var v = Number(n.nilai);
      if (isNaN(v)) return;
      var tg = String(n.tanggal || '');
      if (!pilih || tg > pilih.tg || (tg === pilih.tg && v > pilih.v)) pilih = { v: v, tg: tg };
    });
  });
  return pilih ? pilih.v : 0;
}

function lencana(d, tugas) {
  var out = [];
  var rk = d.ringkas || {};
  var p = Number(rk.persenHadir);

  if (rk.absenTercatat >= 5 && p === 100) out.push({ i: '🎯', t: '100% Kehadiran', c: 'emas' });
  else if (rk.absenTercatat >= 5 && p >= 95) out.push({ i: '🎯', t: 'Kehadiran ' + angka(p) + '%', c: '' });

  /* Berturut-turut tepat waktu: dihitung dari yang paling baru mundur,
     berhenti pada tugas pertama yang telat atau belum dikumpulkan. */
  var urut = (tugas || []).filter(function (t) { return t.batas; })
    .slice().sort(function (a, b) { return String(b.batas).localeCompare(String(a.batas)); });
  var beruntun = 0;
  for (var i = 0; i < urut.length; i++) {
    var t = urut[i];
    var tepat = t.sudah && (!t.tanggal || String(t.tanggal).slice(0, 10) <= String(t.batas).slice(0, 10));
    if (!tepat) break;
    beruntun++;
  }
  if (beruntun >= 5) out.push({ i: '⚡', t: 'On-Time Streaker ×' + beruntun, c: 'emas' });
  else if (beruntun >= 3) out.push({ i: '⚡', t: 'Tepat waktu ×' + beruntun, c: '' });

  var kumpul = (tugas || []).filter(function (x) { return x.sudah; }).length;
  if ((tugas || []).length && kumpul === tugas.length) out.push({ i: '✅', t: 'Semua tugas terkumpul', c: '' });

  var bintang = bintangDari(d);
  if (bintang >= STAR_MAKS * 0.85) out.push({ i: '⭐', t: angka(bintang) + ' Star Points', c: 'emas' });
  else if (bintang > 0) out.push({ i: '⭐', t: angka(bintang) + ' Star Points', c: '' });

  var sk = nilaiSkill(d).filter(function (x) { return x.nilai !== null && x.nilai >= 90; });
  sk.forEach(function (x) { out.push({ i: '🏅', t: x.nama + ' ' + angka(x.nilai), c: 'biru' }); });

  if (!out.length) return '';
  return '<div class="lencana">' + out.map(function (b) {
    return '<span class="' + b.c + '"><i>' + b.i + '</i>' + esc(b.t) + '</span>';
  }).join('') + '</div>';
}

/* ---------------------------------------------------------------
 * KARTU BUKTI KUMPUL TUGAS
 * Bukti digital untuk siswa: waktu server, nomor pengumpulan, dan
 * tautan periksa. Dipakai kalau sewaktu-waktu ada perbedaan catatan.
 * ------------------------------------------------------------- */
function kartuBukti(j, t) {
  var waktu = j.submittedAt || j.waktu || new Date().toISOString();
  var id = j.id || j.submissionId || '';
  return '<div class="bukti"><b>✓ Bukti pengumpulan</b><dl>'
    + '<dt>Tugas</dt><dd>' + esc(j.task || (t && t.judul) || '-') + '</dd>'
    + '<dt>Nama</dt><dd>' + esc((ST.data && ST.data.nama) || '-') + '</dd>'
    + '<dt>Waktu server</dt><dd>' + esc(String(waktu).replace('T', ' ').slice(0, 19)) + ' WIB</dd>'
    + (id ? '<dt>ID pengumpulan</dt><dd>' + esc(id) + '</dd>' : '')
    + (j.group ? '<dt>Anggota</dt><dd>' + esc((j.members || []).join(', ')) + '</dd>' : '')
    + '</dl><p class="kaki" style="text-align:left;margin:8px 0 0">Simpan tangkapan layar ini. '
    + 'Guru melihat catatan yang sama di aplikasinya.</p></div>';
}

/* ==================================================================
 *  LAYAR BERTAB
 *
 *  layarIsi() dulu merangkai delapan bagian berturut-turut menjadi satu
 *  halaman panjang. Sekarang ia hanya menggambar rangkanya — sidebar,
 *  lalu isi tab yang sedang dipilih — dan tiap bagian pindah ke
 *  fungsinya sendiri di bawah.
 *
 *  Yang tidak berubah: seluruh fungsi perangkai isi (blokMapel,
 *  barisTugas, blokMateri, blokCbt, kartuRadar, lencana, kartuKalender)
 *  dipakai apa adanya. Tab hanya mengatur mana yang tampil, bukan
 *  menulis ulang isinya — menulis ulang berarti dua versi dari satu
 *  tampilan, dan yang satu pasti ketinggalan.
 * ================================================================== */

/** Urutan tab. Lambangnya memakai emoji, bukan berkas ikon: portal ini
 *  satu berkas HTML tanpa aset pendamping, dan satu permintaan gambar
 *  yang gagal akan menyisakan kotak kosong di menu. */

/* ------------------------------------------------------------------
 * MATERI AJAR YANG DIUNGGAH GURU
 *
 * Perangkai bloknya sengaja dibuat sama persis dengan yang ada di
 * aplikasi guru (MateriAjar.blokHtml), supaya pratinjau yang dilihat
 * Ustadz sebelum menerbitkan memang sama dengan yang dibaca siswa.
 * Kalau keduanya ditulis terpisah, yang satu pasti ketinggalan.
 * ---------------------------------------------------------------- */
function maBlok(b) {
  if (!b || !b.t) return '';
  switch (b.t) {
    case 'h1': return '<h2 class="mt-h1">' + esc(b.isi) + '</h2>';
    case 'h2': return '<h3 class="mt-h2">' + esc(b.isi) + '</h3>';
    case 'h3': return '<h4 class="mt-h3">' + esc(b.isi) + '</h4>';
    case 'quote': return '<blockquote class="mt-q">' + esc(b.isi) + '</blockquote>';
    case 'kode': return '<pre class="mt-kode">' + esc(b.isi) + '</pre>';
    case 'pisah': return '<hr class="mt-pisah">';
    case 'ul':
    case 'ol': {
      var tag = b.t === 'ol' ? 'ol' : 'ul';
      return '<' + tag + ' class="mt-list">'
        + (b.isi || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('')
        + '</' + tag + '>';
    }
    case 'tabel': {
      var r = b.baris || [];
      if (!r.length) return '';
      var kep = b.kepala
        ? '<thead><tr>' + r[0].map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead>'
        : '';
      var sisa = b.kepala ? r.slice(1) : r;
      return '<div class="mt-tabel-bungkus"><table class="mt-tabel">' + kep + '<tbody>'
        + sisa.map(function (row) {
          return '<tr>' + row.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    default: return '<p class="mt-p">' + esc(b.isi) + '</p>';
  }
}

function blokMateriAjar(d) {
  var daftar = (d && d.materiAjar) || [];
  if (!daftar.length) return '';
  return daftar.map(function (m) {
    var buka = ST.materiBuka[m.id] ? ' buka' : '';
    var tema = ['jade', 'laut', 'senja', 'kertas'].indexOf(m.tema) >= 0 ? m.tema : 'jade';
    return '<div class="ma-kartu ma-' + tema + buka + '">'
      + '<button class="ma-kepala" data-materi="' + esc(m.id) + '">'
      + '<span class="ma-t"><b>' + esc(m.judul) + '</b><small>'
      + (m.ringkas ? esc(m.ringkas) + ' \u00B7 ' : '')
      + esc(m.mapel || '') + (m.tanggal ? ' \u00B7 ' + tgl(m.tanggal) : '')
      + '</small></span><span class="ma-panah">\u203A</span></button>'
      + '<div class="ma-badan">' + (m.blok || []).map(maBlok).join('') + '</div>'
      + '</div>';
  }).join('');
}

function daftarTab() {
  var d = ST.data || {};
  var belum = (ST.tugas || []).filter(function (t) { return !t.sudah; }).length;
  var cbt = ST.data ? blokCbt(ST.data) : '';
  var materiAda = ((d.materi || []).length > 0) || ((d.materiAjar || []).length > 0);
  return [
    { k: 'beranda', l: 'Beranda', i: '\u{1F3E0}' },
    { k: 'absen', l: 'Absen', i: '\u{1F4CD}' },
    { k: 'nilai', l: 'Nilai Rapor', i: '\u{1F4CA}' },
    { k: 'tugas', l: 'Tugas', i: '\u{1F4DD}', n: belum || 0 },
    { k: 'latihan', l: 'Latihan', i: '\u{1F9E0}', ada: !!cbt },
    { k: 'materi', l: 'Materi Pembelajaran', i: '\u{1F4D8}', ada: materiAda },
    { k: 'pengaturan', l: 'Pengaturan', i: '⚙️' }
  ].filter(function (t) { return t.ada !== false; });
}

function tabAktif() {
  var ada = daftarTab().map(function (t) { return t.k; });
  if (ada.indexOf(ST.tab) < 0) ST.tab = 'beranda';
  return ST.tab;
}

function sidebarHtml(d) {
  var kini = tabAktif();
  var kelas = (d.kelas || []).join(' · ');
  return '<nav class="sisi' + (ST.sisiTutup ? ' tutup' : '') + (ST.laciBuka ? ' buka' : '') + '" id="sisi">'
    + '<div class="siswa"><b>' + esc(d.nama || '') + '</b><span>' + esc(kelas)
    + (d.nis ? ' · NIS ' + esc(d.nis) : '') + '</span></div>'
    + daftarTab().map(function (t) {
      return '<button class="tab-tombol' + (t.k === kini ? ' on' : '') + '" data-tab="' + t.k + '">'
        + '<span class="lam">' + t.i + '</span><span class="teks">' + esc(t.l) + '</span>'
        + (t.n ? '<span class="jml">' + t.n + '</span>' : '') + '</button>';
    }).join('')
    + '<div class="sisi-kaki">'
    + '<button class="btn-lipat" id="btn-lipat">' + (ST.sisiTutup ? '»' : '« Sembunyikan') + '</button>'
    + '<button class="tab-tombol" id="btn-keluar"><span class="lam">↩</span><span class="teks">Keluar</span></button>'
    + '</div></nav>';
}

/* ----------------------------- TAB ------------------------------- */

function tabBeranda(d) {
  var semua = ST.tugas || [];
  var belum = semua.filter(function (t) { return !t.sudah; });
  belum.sort(function (a, b) { return String(a.batas || '9999').localeCompare(String(b.batas || '9999')); });
  var s = lencana(d, semua);
  s += kartuRadar(d);

  /* Yang paling mendesak naik ke atas: tiga tugas terdekat batasnya.
     Selebihnya ada di tab Tugas — beranda bukan tempat daftar panjang. */
  if (belum.length) {
    s += '<h2 class="bagian">Paling dekat batasnya</h2>'
      + belum.slice(0, 3).map(barisTugas).join('')
      + (belum.length > 3
        ? '<p class="kaki" style="text-align:left;margin-top:9px">Masih ada '
          + (belum.length - 3) + ' lagi di tab Tugas.</p>' : '');
  } else if (semua.length) {
    s += '<h2 class="bagian">Tugas</h2>'
      + '<div class="mapel"><div class="tanpa" style="margin:0">Semua tugasmu sudah terkumpul.</div></div>';
  }

  var um = d.pengumuman || [];
  if (um.length) s += '<h2 class="bagian">Pengumuman &amp; jadwal ujian</h2>' + um.map(kartuPengumuman).join('');
  return s;
}

function kartuPengumuman(x) {
  return '<div class="umum"><div class="atas"><div class="j">' + esc(x.judul || '') + '</div>'
    + '<span class="cap jade">' + esc(x.jenis || '') + '</span></div>'
    + '<div class="t">' + tgl(x.tanggal) + (x.jam ? ' · ' + esc(x.jam) : '')
    + ' &nbsp;·&nbsp; ' + esc(x.mapel || x.kelas || '') + '</div>'
    + (x.isi ? '<div class="i">' + esc(x.isi) + '</div>' : '')
    + (x.tanggal
      ? '<a class="tombol sunyi" style="margin-top:11px" target="_blank" rel="noopener" '
        + 'href="' + esc(tautanSatuAcara(x)) + '">Tambah ke Calendar</a>'
      : '')
    + '</div>';
}

function tabAbsen(d) {
  var rk = d.ringkas || {};
  var s = kartuAbsenMandiri(d);

  s += '<h2 class="bagian">Ringkasan kehadiran</h2><div class="absen-ring">'
    + '<div><small>Hadir</small><b>' + (rk.hadir || 0) + ' / ' + (rk.absenTercatat || 0) + '</b></div>'
    + (rk.persenHadir !== null && rk.persenHadir !== undefined
      ? '<div><small>Persen kehadiran</small><b>' + angka(rk.persenHadir) + '%</b></div>' : '')
    + '</div>';

  var absen = [];
  (d.kelas || []).forEach(function (k) {
    var r = ST.rinci[k];
    if (r && r.absen) r.absen.forEach(function (a) { absen.push({ k: k, a: a }); });
  });
  absen.sort(function (x, y) { return String(y.a.date).localeCompare(String(x.a.date)); });
  if (absen.length) {
    s += '<h2 class="bagian">Riwayat kehadiran</h2>'
      + '<table class="absen"><tbody>' + absen.slice(0, 60).map(function (x) {
        return '<tr><td>' + tgl(x.a.date) + '</td><td class="st-' + esc(x.a.status) + '">'
          + esc(x.a.status || '-') + '</td></tr>';
      }).join('') + '</tbody></table>'
      + (absen.length > 60
        ? '<p class="kaki" style="text-align:left;margin-top:8px">Menampilkan 60 terbaru dari '
          + absen.length + ' pertemuan.</p>' : '');
  } else {
    s += '<h2 class="bagian">Riwayat kehadiran</h2>'
      + '<div class="mapel"><div class="tanpa" style="margin:0">Belum ada pertemuan yang diabsen.</div></div>';
  }
  return s;
}

/** Kartu absen mandiri. Keadaannya dibaca dari server (ST.absen), bukan
 *  ditebak dari jam di HP — jam HP bisa digeser, dan tombol yang terlihat
 *  bisa ditekan padahal pasti ditolak hanya membuat bingung. */
function kartuAbsenMandiri(d) {
  var a = ST.absen;
  if (!a) {
    return '<div class="absen-kartu"><h3>Absen hari ini</h3>'
      + '<p>Sedang memeriksa…</p></div>';
  }
  if (!a.aktif) {
    return '<div class="absen-kartu"><h3>Absen hari ini</h3>'
      + '<p>Absen mandiri sedang ditutup. Kehadiranmu dicatat oleh gurumu.</p></div>';
  }
  var kelas = (d.kelas || []);
  return kelas.map(function (k) {
    var p = (a.perKelas || []).filter(function (x) { return x.kelas === k; })[0] || { sudah: false };
    var isi;
    if (p.sudah) {
      isi = '<div class="absen-sudah"><span class="tnd">✓</span><span>'
        + (p.olehGuru
          ? 'Gurumu sudah mencatat kehadiranmu hari ini: <b>' + esc(p.status) + '</b>.'
          : 'Kamu sudah absen hari ini sebagai <b>' + esc(p.status) + '</b>.')
        + '</span></div>';
    } else {
      isi = '<p>Tekan tombol ini untuk menandai bahwa kamu hadir hari ini. '
        + 'Sekali saja — dan gurumu tetap bisa membetulkannya.</p>'
        + '<button class="tombol" data-absen="' + esc(k) + '">Saya hadir hari ini</button>';
    }
    return '<div class="absen-kartu"><h3>Absen hari ini'
      + (kelas.length > 1 ? ' · ' + esc(k) : '') + '</h3>' + isi
      + '<div class="pesan-absen" data-pesan="' + esc(k) + '"></div></div>';
  }).join('');
}

function tabNilai(d) {
  var g = perMapel(d);
  var s = kartuRadar(d);
  s += '<h2 class="bagian">Nilaiku per mata pelajaran</h2>';
  s += g.length ? g.map(blokMapel).join('')
    : '<div class="mapel"><div class="tanpa" style="margin:0">Belum ada nilai yang tercatat untukmu.</div></div>';
  s += kartuBukti(d);
  return s;
}

function tabTugas(d) {
  var semua = ST.tugas || [];
  var belum = semua.filter(function (t) { return !t.sudah; });
  var sudah = semua.filter(function (t) { return t.sudah; });
  belum.sort(function (a, b) { return String(a.batas || '9999').localeCompare(String(b.batas || '9999')); });
  sudah.sort(function (a, b) { return String(b.tanggal || '').localeCompare(String(a.tanggal || '')); });

  var s = '';
  if (belum.length) {
    s += '<h2 class="bagian">Belum kamu kumpulkan (' + belum.length + ')</h2>' + belum.map(barisTugas).join('');
  } else {
    s += '<h2 class="bagian">Belum kamu kumpulkan</h2>'
      + '<div class="mapel"><div class="tanpa" style="margin:0">'
      + (semua.length ? 'Tidak ada. Semua tugasmu sudah terkumpul.' : 'Belum ada tugas untukmu.')
      + '</div></div>';
  }
  if (sudah.length) {
    s += '<h2 class="bagian">Sudah kamu kumpulkan (' + sudah.length + ')</h2>' + sudah.map(barisTugas).join('');
  }
  return s;
}

function tabLatihan(d) {
  var cbt = blokCbt(d);
  return cbt
    ? '<h2 class="bagian">Ujian &amp; latihan CBT</h2>' + cbt
    : '<div class="mapel"><div class="tanpa" style="margin:0">Belum ada latihan atau ujian CBT untukmu.</div></div>';
}

function tabMateri(d) {
  var ajar = blokMateriAjar(d);
  var s = '';
  /* Bahan ajar yang diunggah guru lebih dulu: itulah yang memang dibuat
     untuk dibaca. Catatan pertemuan menyusul sebagai riwayat. */
  if (ajar) s += '<h2 class="bagian">Bahan belajar</h2>' + ajar;
  s += '<h2 class="bagian">Catatan tiap pertemuan</h2>' + blokMateri(d);
  return s;
}

function tabPengaturan(d) {
  return '<h2 class="bagian">Google Calendar</h2>' + kartuKalender(d)
    + '<h2 class="bagian">Emailku</h2><div class="akun">'
    + '<p>Sematkan emailmu supaya pemberitahuan tugas, ulangan, dan ujian dari gurumu '
    + 'langsung masuk ke email dan Google Calendar-mu.</p>'
    + '<label for="email">Alamat email</label>'
    + '<input type="email" id="email" autocomplete="email" placeholder="namamu@gmail.com" value="'
    + esc(d.email || '') + '">'
    + '<button class="tombol" id="btn-email">Simpan email</button>'
    + '<div id="email-pesan"></div></div>';
}

/* --------------------------- RANGKA ------------------------------ */

function isiTabSekarang(d) {
  switch (tabAktif()) {
    case 'absen': return tabAbsen(d);
    case 'nilai': return tabNilai(d);
    case 'tugas': return tabTugas(d);
    case 'latihan': return tabLatihan(d);
    case 'materi': return tabMateri(d);
    case 'pengaturan': return tabPengaturan(d);
    default: return tabBeranda(d);
  }
}

function layarIsi() {
  var d = ST.data;
  if (!d) { layarMasuk(''); return; }
  var bungkus = document.querySelector('.bungkus');
  if (bungkus) bungkus.classList.add('ber-tab');

  var judul = (daftarTab().filter(function (t) { return t.k === tabAktif(); })[0] || {}).l || '';
  var s = '<button class="btn-laci" id="btn-laci">☰ ' + esc(judul) + '</button>'
    + '<div class="tata">' + sidebarHtml(d)
    + '<div class="isi-tab" id="isi-tab"><div id="kabar"></div>' + isiTabSekarang(d) + '</div>'
    + '</div><div class="tirai' + (ST.laciBuka ? ' on' : '') + '" id="tirai"></div>';

  el('layar').innerHTML = s;
  el('kaki').textContent = 'Halaman ini hanya menampilkan datamu sendiri.';
  pasangPeristiwa();

  /* Keadaan absen diambil sekali per sesi, lalu tabnya digambar ulang.
     Diambil di sini dan bukan saat masuk supaya beranda tidak perlu
     menunggu satu permintaan lagi sebelum tampil. */
  if (!ST.absen && !ST.absenMinta) {
    ST.absenMinta = true;
    panggil('absenMandiriStatus', { nomor: ST.nomor }).then(function (j) {
      ST.absen = j;
      if (tabAktif() === 'absen') layarIsi();
    }, function () { ST.absen = { aktif: false, perKelas: [] }; });
  }
}

function pasangPeristiwa() {
  [].slice.call(document.querySelectorAll('[data-tab]')).forEach(function (b) {
    b.addEventListener('click', function () {
      ST.tab = b.getAttribute('data-tab');
      ST.laciBuka = false;
      layarIsi();
      window.scrollTo(0, 0);
    });
  });
  var laci = el('btn-laci');
  if (laci) laci.addEventListener('click', function () { ST.laciBuka = !ST.laciBuka; layarIsi(); });
  var tirai = el('tirai');
  if (tirai) tirai.addEventListener('click', function () { ST.laciBuka = false; layarIsi(); });
  var lipat = el('btn-lipat');
  if (lipat) lipat.addEventListener('click', function () { ST.sisiTutup = !ST.sisiTutup; layarIsi(); });

  var keluar = el('btn-keluar');
  if (keluar) keluar.addEventListener('click', function () {
    lupakan();
    ST.data = null; ST.rinci = {}; ST.tugas = []; ST.buka = '';
    ST.tab = 'beranda'; ST.absen = null; ST.absenMinta = false;
    var b = document.querySelector('.bungkus');
    if (b) b.classList.remove('ber-tab');
    layarMasuk('');
  });

  var be = el('btn-email');
  if (be) be.addEventListener('click', simpanEmail);
  var bm = el('btn-materi');
  if (bm) bm.addEventListener('click', function () { ST.semuaMateri = true; layarIsi(); });

  [].slice.call(document.querySelectorAll('[data-buka]')).forEach(function (b) {
    b.addEventListener('click', function () { bukaBorang(b.getAttribute('data-buka')); });
  });
  [].slice.call(document.querySelectorAll('[data-kirim]')).forEach(function (b) {
    b.addEventListener('click', function () { kirimTugas(b.getAttribute('data-kirim')); });
  });
  [].slice.call(document.querySelectorAll('[data-absen]')).forEach(function (b) {
    b.addEventListener('click', function () { absenSekarang(b.getAttribute('data-absen'), b); });
  });
  [].slice.call(document.querySelectorAll('[data-materi]')).forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.getAttribute('data-materi');
      ST.materiBuka[id] = !ST.materiBuka[id];
      /* Kartunya dibuka langsung di tempat, bukan dengan menggambar ulang
         seluruh tab: menggambar ulang melompatkan halaman ke atas, dan
         siswa kehilangan tempatnya di daftar. */
      var kartu = b.parentNode;
      if (kartu) kartu.classList.toggle('buka', !!ST.materiBuka[id]);
    });
  });

  var salin = el('btn-salin');
  if (salin) {
    salin.addEventListener('click', function () {
      var i = el('umpan'), p = el('kal-pesan');
      try {
        i.select(); i.setSelectionRange(0, 99999);
        var ok = document.execCommand && document.execCommand('copy');
        if (!ok && navigator.clipboard) navigator.clipboard.writeText(i.value);
        p.innerHTML = '<div class="kabar-ok" style="margin:11px 0 0">Alamat tersalin. '
          + 'Tempelkan di aplikasi kalendermu, pada menu "berlangganan kalender dari URL".</div>';
      } catch (e) {
        p.innerHTML = '<div class="galat"><b>Belum tersalin</b>'
          + 'Tekan lama pada alamat di atas, lalu pilih Salin.</div>';
      }
    });
  }
  var fokus = ST.buka && el('tautan-' + ST.buka);
  if (fokus) fokus.focus();
}

/** Menandai hadir. Tombolnya dimatikan sejak ditekan, bukan sesudah
 *  jawabannya datang: tekan dua kali pada sambungan lambat adalah cara
 *  termudah mengirim dua permintaan sekaligus. */
function absenSekarang(kelas, tombol) {
  if (tombol) { tombol.disabled = true; tombol.textContent = 'Mencatat…'; }
  var kotak = document.querySelector('[data-pesan="' + kelas + '"]');
  panggil('absenMandiri', { nomor: ST.nomor, className: kelas }).then(function (j) {
    ST.absen = null; ST.absenMinta = false;
    if (kotak) kotak.innerHTML = '<div class="kabar-ok" style="margin:11px 0 0">' + esc(j.pesan || 'Tercatat.') + '</div>';
    panggil('absenMandiriStatus', { nomor: ST.nomor }).then(function (st) {
      ST.absen = st; ST.absenMinta = true;
      if (tabAktif() === 'absen') layarIsi();
    }, function () { ST.absenMinta = true; });
    /* Riwayat kehadiran ikut disegarkan, supaya baris hari ini benar-benar
       muncul di tabelnya dan bukan hanya di kartu atas. */
    (ST.data.kelas || []).forEach(function (k) {
      panggil('studentRecap', { className: k, studentName: ST.data.nama })
        .then(function (r) { ST.rinci[k] = r; }, function () { });
    });
  }, function (e) {
    if (tombol) { tombol.disabled = false; tombol.textContent = 'Saya hadir hari ini'; }
    if (kotak) kotak.innerHTML = '<div class="galat"><b>Belum tercatat</b>' + esc(e.message || String(e)) + '</div>';
  });
}
function simpanEmail() {
  var i = el('email');
  var v = i ? String(i.value || '').trim() : '';
  var p = el('email-pesan');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) {
    p.innerHTML = '<div class="galat"><b>Alamatnya belum benar</b>Contoh yang benar: namamu@gmail.com</div>';
    return;
  }
  var b = el('btn-email');
  b.disabled = true; b.textContent = 'Menyimpan…';
  panggil('siswaEmailSimpan', { nomor: ST.nomor, email: v }).then(function () {
    return muat(ST.nomor);
  }).then(function () {
    layarIsi();
    var q = el('email-pesan');
    if (q) q.innerHTML = '<div class="galat" style="background:var(--jade-muda);color:var(--jade-tua)">'
      + '<b>Tersimpan</b>Pemberitahuan dari gurumu akan dikirim ke alamat itu.</div>';
  }, function (e) {
    b.disabled = false; b.textContent = 'Simpan email';
    p.innerHTML = '<div class="galat"><b>Gagal menyimpan</b>' + esc(e.message || e) + '</div>';
  });
}

/* --- mulai ------------------------------------------------------- */
(function () {
  var n = diingat();
  if (!n) { layarMasuk(''); return; }
  el('layar').innerHTML = '<div class="memuat">Memuat berandamu…</div>';
  muat(n).then(layarIsi, function (e) { lupakan(); layarMasuk(e.message || String(e)); });
})();
</script>
