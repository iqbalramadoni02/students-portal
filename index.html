/* =====================================================================
   BERANDA SISWA — halaman berdiri sendiri, tersambung ke Apps Script
   milik Ustadz Iqbal. Tidak membawa API key: seluruh aksi yang dipakai
   (siswaMasuk, siswaRingkas, studentRecap) dilayani server sebelum
   pemeriksaan key, jadi tautannya aman dibagikan ke grup kelas.

   Satu pertanyaan yang harus dijawab halaman ini dalam sekali lihat:
   "berapa nilaiku, apa yang belum kukumpulkan, absenku bagaimana."
   ===================================================================== */
:root {
  --kertas: #F4FBF2;        /* kertas sage, bukan krem */
  --papan: #FFFFFF;
  --tinta: #161D18;         /* hitam kehijauan, bukan abu bertint */
  --tinta-2: #3F4943;
  --tinta-3: #6F7972;
  --jade: #1D6B4C;          /* warna sistem Ustadz */
  --jade-tua: #124430;
  --jade-muda: #E3EDE6;
  --emas: #7E5700;          /* yang belum dikumpulkan */
  --emas-muda: #FFDEAB;
  --merah: #BA1A1A;         /* sudah lewat batas */
  --merah-muda: #FFDAD6;
  --garis: #BFC9C1;
  --garis-tipis: #E3EAE1;
  --tombol-teks: #FFFFFF;   /* tulisan di atas tombol utama */
  --r: 16px;                /* kartu */
  --r-kecil: 8px;           /* kendali & ubin nomor */
  --r-pil: 9999px;          /* pil, tombol utama, lencana */
}
/* Mode gelap mengikuti HP siswa. Ditulis tidak bersarang supaya didukung juga
   oleh peramban lama, dan dijaga :not([data-theme="light"]) agar pilihan
   terang yang disetel eksplisit tetap menang. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --kertas: #101712; --papan: #17201A; --tinta: #E8EFE9; --tinta-2: #AEBDB3;
    --tinta-3: #7E8E84; --jade: #58B189; --jade-tua: #8ED0AC; --jade-muda: #1B2A21;
    --emas: #D9A64B; --emas-muda: #2A2318; --merah: #E08C82; --merah-muda: #2B1A18;
    --garis: #2A362E; --garis-tipis: #212B24;
    --tombol-teks: #0C1710;
  }
}
:root[data-theme="dark"] {
  --kertas: #101712; --papan: #17201A; --tinta: #E8EFE9; --tinta-2: #AEBDB3;
  --tinta-3: #7E8E84; --jade: #58B189; --jade-tua: #8ED0AC; --jade-muda: #1B2A21;
  --emas: #D9A64B; --emas-muda: #2A2318; --merah: #E08C82; --merah-muda: #2B1A18;
  --garis: #2A362E; --garis-tipis: #212B24; --tombol-teks: #0C1710;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--kertas);
  color: var(--tinta);
  font: 400 16px/1.55 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 0 16px env(safe-area-inset-bottom) 16px;
}
.bungkus { max-width: 560px; margin: 0 auto; padding: 22px 0 56px; }


/* --- radar kemampuan, lencana, dan bukti kumpul ------------------- */
.radar { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 18px 16px 12px; margin-bottom: 14px; }
.radar h3 { font: 600 16px/1.3 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; margin: 0 0 2px; }
.radar p.ket { color: var(--tinta-3); font-size: 13px; margin: 0 0 10px; }
.radar svg { display: block; width: 100%; height: auto; max-width: 380px; margin: 0 auto; }
.radar .jaring { fill: none; stroke: var(--garis); stroke-width: 1; }
.radar .sumbu { stroke: var(--garis); stroke-width: 1; }
.radar .bidang { fill: var(--jade); fill-opacity: .18; stroke: var(--jade); stroke-width: 2; stroke-linejoin: round; }
.radar .titik { fill: var(--jade); }
.radar .nama { font: 600 10.5px 'Plus Jakarta Sans', sans-serif; fill: var(--tinta-2); }
.radar .nilai { font: 700 10px 'Space Grotesk', sans-serif; fill: var(--jade-tua); font-variant-numeric: tabular-nums; }
.radar .tanpa { color: var(--tinta-3); font-size: 13.5px; text-align: center; padding: 14px 0; }

.lencana { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 14px; }
.lencana span {
  display: inline-flex; align-items: center; gap: 6px;
  font: 700 11px/1 'Plus Jakarta Sans', sans-serif; letter-spacing: .04em;
  padding: 7px 12px; border-radius: var(--r-pil);
  background: var(--jade-muda); color: var(--jade-tua);
}
.lencana span.emas { background: var(--emas-muda); color: var(--emas); }
.lencana span.biru { background: var(--jade-muda); color: var(--jade-tua); }
.lencana span i { font-style: normal; font-size: 13px; }

.bukti {
  background: var(--papan); border: 1px solid var(--jade); border-left: 3px solid var(--jade);
  border-radius: var(--r); padding: 14px 16px; margin: 10px 0 0;
}
.bukti b { display: block; font: 600 15px/1.3 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; margin-bottom: 6px; color: var(--jade-tua); }
.bukti dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
.bukti dt { color: var(--tinta-3); }
.bukti dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; word-break: break-all; }

/* --- pita atas --------------------------------------------------- */
.pita { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }
/* Lambang asli sekolah, ditanam sebagai data URI supaya halaman ini tetap
   tidak memanggil apa pun dari luar — tetap tampil walau ikonnya belum
   ikut ter-upload ke hosting. */
.pita img { width: 34px; height: 34px; flex: none; border-radius: 8px; display: block; }
.pita b { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.pita span { color: var(--tinta-3); font-size: 13px; }

/* --- masuk ------------------------------------------------------- */
.masuk { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 26px 22px; }
.masuk h1 { font: 600 25px/1.2 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; margin: 0 0 6px; letter-spacing: -.01em; }
.masuk p { color: var(--tinta-2); margin: 0 0 20px; font-size: 14.5px; max-width: 42ch; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--tinta-2); margin-bottom: 7px; }
input[type=text], input[type=email] {
  width: 100%; font: 500 19px/1 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; letter-spacing: .04em;
  padding: 14px 15px; border: 1.5px solid var(--garis); border-radius: 12px;
  background: var(--kertas); color: var(--tinta);
}
input[type=text]:focus, input[type=email]:focus { outline: 2.5px solid var(--jade); outline-offset: 1px; border-color: transparent; }
.tombol {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 15.5px/1 'Plus Jakarta Sans', sans-serif; padding: 15px 24px; border-radius: var(--r-pil);
  border: 1.5px solid var(--jade-tua); background: var(--jade-tua); color: var(--tombol-teks);
  cursor: pointer; width: 100%; margin-top: 14px;
}
.tombol:active { transform: translateY(1px); }
.tombol:focus-visible { outline: 3px solid var(--jade); outline-offset: 2px; }
.tombol.sunyi { background: transparent; color: var(--jade-tua); border-color: var(--garis); width: auto; margin: 0; padding: 9px 14px; font-size: 13.5px; }
.tombol[disabled] { opacity: .55; cursor: progress; }
.galat { background: var(--merah-muda); color: var(--merah); border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-top: 14px; }
.galat b { display: block; margin-bottom: 2px; }

/* --- kepala siswa ------------------------------------------------ */
.kepala { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.kepala h1 { font: 600 26px/1.15 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; margin: 0; letter-spacing: -.015em; flex: 1; }
.identitas { color: var(--tinta-3); font-size: 13.5px; margin: 0 0 24px; }
.identitas b { color: var(--tinta-2); font-weight: 600; }

/* --- judul bagian: garis jade, bukan label huruf besar ----------- */
h2.bagian {
  font: 600 13.5px/1 'Plus Jakarta Sans', sans-serif; color: var(--jade-tua);
  margin: 30px 0 12px; padding-left: 10px; border-left: 3px solid var(--jade);
}

/* --- blok nilai per jenis kelas: rata kanan angka slab ----------- */
.mapel { background: var(--papan); border: 1px solid var(--garis); border-left: 3px solid var(--jade); border-radius: var(--r); padding: 16px 18px; margin-bottom: 12px; }
.mapel .atas { display: flex; align-items: baseline; gap: 12px; }
.mapel .nm { font: 600 17px/1.25 'Plus Jakarta Sans', sans-serif; flex: 1; letter-spacing: -.01em; }
.mapel .angka { font: 600 34px/1 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mapel .huruf { font: 600 14px/1 'Plus Jakarta Sans', sans-serif; color: var(--jade-tua); background: var(--jade-muda); border-radius: var(--r-pil); padding: 5px 11px; }
.mapel .sub { color: var(--tinta-3); font-size: 13px; margin-top: 2px; }
.butir { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.butir div { background: var(--kertas); border: 1px solid var(--garis-tipis); border-radius: var(--r-kecil); padding: 6px 9px; font-size: 12.5px; color: var(--tinta-2); }
.butir div b { font: 600 14px 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; color: var(--tinta); font-variant-numeric: tabular-nums; }
.tanpa { color: var(--tinta-3); font-size: 13.5px; margin-top: 12px; font-style: italic; }

/* --- tugas ------------------------------------------------------- */
.tugas { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 14px 16px; margin-bottom: 9px; }
.tugas .baris { display: flex; gap: 12px; align-items: flex-start; }
.tugas.belum { border-left: 3px solid var(--emas); }
.tugas.lewat { border-left: 3px solid var(--merah); }
.tugas.sudah { border-left: 3px solid var(--garis); }
.tugas .isi { flex: 1; min-width: 0; }
.tugas .j { font-weight: 600; font-size: 15px; letter-spacing: -.005em; }
.tugas .k { color: var(--tinta-3); font-size: 13px; margin-top: 3px; }
.tugas .n { font: 600 22px/1 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-variant-numeric: tabular-nums; flex: none; }
.cap { font: 600 11px/1 'Plus Jakarta Sans', sans-serif; letter-spacing: .04em; border-radius: var(--r-pil); padding: 6px 11px; flex: none; white-space: nowrap; }
.cap.emas { background: var(--emas-muda); color: var(--emas); }
.cap.merah { background: var(--merah-muda); color: var(--merah); }
.cap.jade { background: var(--jade-muda); color: var(--jade-tua); }

/* --- borang pengumpulan tugas ------------------------------------ */
.tugas > .tombol.sunyi { width: auto; margin-top: 11px; }
.borang { margin-top: 13px; padding-top: 13px; border-top: 1px dashed var(--garis); }
.borang label { margin-top: 0; }
.borang input[type=text], .borang textarea {
  width: 100%; font: 400 15px/1.5 'Plus Jakarta Sans', sans-serif; letter-spacing: 0;
  padding: 12px 14px; border: 1.5px solid var(--garis); border-radius: 12px;
  background: var(--kertas); color: var(--tinta); resize: vertical;
}
.borang input[type=text]:focus, .borang textarea:focus { outline: 2.5px solid var(--jade); outline-offset: 1px; border-color: transparent; }
.petunjuk { background: var(--kertas); border-radius: 8px; padding: 11px 13px; font-size: 14px; color: var(--tinta-2); margin-bottom: 13px; white-space: pre-wrap; }
.anggota { display: flex; flex-direction: column; gap: 2px; max-height: 232px; overflow-y: auto; border: 1px solid var(--garis); border-radius: 8px; padding: 7px; background: var(--kertas); }
label.pilih { display: flex; align-items: center; gap: 9px; font-weight: 400; font-size: 14.5px; color: var(--tinta); margin: 0; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
label.pilih:hover { background: var(--jade-muda); }
label.pilih input { width: 19px; height: 19px; accent-color: var(--jade); flex: none; }
#umpan { font: 400 12.5px/1.4 'Plus Jakarta Sans', monospace; letter-spacing: 0; word-break: break-all; }
a.tombol { text-decoration: none; }
.kabar-ok { background: var(--jade-muda); color: var(--jade-tua); border-radius: var(--r); padding: 13px 15px; font-size: 14.5px; font-weight: 600; margin-bottom: 18px; }

/* --- absensi ----------------------------------------------------- */
.absen-ring { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.absen-ring div { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 12px 14px; flex: 1; min-width: 118px; }
.absen-ring small { display: block; color: var(--tinta-3); font-size: 12.5px; }
.absen-ring b { font: 600 24px/1.15 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-variant-numeric: tabular-nums; }
table.absen { width: 100%; border-collapse: collapse; background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); overflow: hidden; }
table.absen td { padding: 10px 14px; border-top: 1px solid var(--garis-tipis); font-size: 14px; }
table.absen tr:first-child td { border-top: 0; }
table.absen td:first-child { font-variant-numeric: tabular-nums; color: var(--tinta-2); width: 10.5em; }
table.absen td:last-child { text-align: right; font-weight: 600; }
.st-Hadir { color: var(--jade-tua); }
.st-Sakit, .st-Izin { color: var(--emas); }
.st-Alpa { color: var(--merah); }

/* --- pengumuman -------------------------------------------------- */
.umum { background: var(--jade-muda); border-radius: var(--r); padding: 14px 16px; margin-bottom: 9px; }
.umum .atas { display: flex; align-items: baseline; gap: 9px; }
.umum .j { font-weight: 600; font-size: 15px; flex: 1; }
.umum .t { color: var(--tinta-2); font-size: 13px; margin-top: 4px; }
.umum .i { font-size: 14px; margin-top: 7px; color: var(--tinta-2); }

/* --- akun -------------------------------------------------------- */
/* --- materi & bahan belajar yang ditempel gurunya di pertemuan --- */
.tombol-baris { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
.tombol-baris .tombol { margin: 0; }
.bahan-teks { background: var(--kertas); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--tinta-2); margin-top: 11px; }
.materi { background: var(--papan); border: 1px solid var(--garis); border-left: 3px solid var(--jade); border-radius: var(--r); padding: 14px 16px; margin-bottom: 9px; }
.materi .atas { display: flex; align-items: baseline; gap: 10px; }
.materi .j { font-weight: 600; font-size: 15px; flex: 1; letter-spacing: -.005em; min-width: 0; }
.materi .t { color: var(--tinta-3); font-size: 13px; margin-top: 3px; }
.materi dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 11px 0 0; font-size: 13.5px; }
.materi dt { color: var(--tinta-3); }
.materi dd { margin: 0; color: var(--tinta-2); white-space: pre-wrap; }
.bahan-daftar { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.bahan-daftar a {
  display: flex; align-items: center; gap: 9px; background: var(--kertas);
  border: 1px solid var(--garis-tipis); border-radius: var(--r-kecil);
  padding: 10px 12px; font-size: 13.5px; font-weight: 600;
  color: var(--jade-tua); text-decoration: none; word-break: break-word;
}
.bahan-daftar a:hover { border-color: var(--jade); }
.bahan-daftar a i { font-style: normal; flex: none; }
/* --- ujian CBT --- */
.ujian { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 14px 16px; margin-bottom: 9px; }
.ujian.berlangsung { border-left: 3px solid var(--jade); }
.ujian.akan { border-left: 3px solid var(--emas); }
.ujian.lewat { border-left: 3px solid var(--garis); }
.ujian .baris { display: flex; gap: 12px; align-items: flex-start; }
.ujian .isi { flex: 1; min-width: 0; }
.ujian .j { font-weight: 600; font-size: 15px; letter-spacing: -.005em; }
.ujian .k { color: var(--tinta-3); font-size: 13px; margin-top: 3px; }
.ujian .n { font: 600 22px/1 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-variant-numeric: tabular-nums; flex: none; }
.akun { background: var(--papan); border: 1px solid var(--garis); border-radius: var(--r); padding: 16px 18px; }
.akun p { color: var(--tinta-2); font-size: 14px; margin: 0 0 14px; }
.kaki { color: var(--tinta-3); font-size: 12.5px; text-align: center; margin-top: 32px; line-height: 1.6; }
.memuat { color: var(--tinta-3); font-size: 14.5px; padding: 28px 0; text-align: center; }

@media (max-width: 380px) {
  .mapel .angka { font-size: 29px; }
  .kepala h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ==================================================================
   SIDEBAR BERTAB — menggantikan satu gulungan panjang

   Dulu seluruh isi beranda ditumpuk dalam satu halaman: nilai, tugas,
   absensi, materi, pengumuman, dan pengaturan email. Di HP itu berarti
   menggulir belasan layar hanya untuk sampai ke materi. Sekarang tiap
   bagian punya tabnya sendiri.

   Di layar lebar sidebar menempel di kiri. Di HP ia menjadi laci yang
   menutup sendiri sesudah satu tab dipilih — bukan sekadar menyempit,
   sebab sidebar setinggi layar di HP memakan ruang yang justru
   dibutuhkan isinya.
   ================================================================== */

.bungkus.ber-tab { max-width: 1080px; }

.tata { display: flex; gap: 26px; align-items: flex-start; }

/* ---- sidebar ---- */
.sisi {
  flex: 0 0 232px; position: sticky; top: 18px;
  background: var(--papan); border: 1px solid var(--garis-tipis);
  border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 3px;
}
.sisi.tutup { flex-basis: 62px; }
.sisi .siswa {
  padding: 11px 12px 13px; border-bottom: 1px solid var(--garis-tipis); margin-bottom: 7px;
}
.sisi .siswa b { display: block; font: 700 15px/1.3 'Plus Jakarta Sans', sans-serif; color: var(--tinta); }
.sisi .siswa span { display: block; margin-top: 3px; font: 500 12px/1.4 'Plus Jakarta Sans', sans-serif; color: var(--tinta-3); }
.sisi.tutup .siswa { display: none; }

.tab-tombol {
  display: flex; align-items: center; gap: 11px; width: 100%;
  font: 600 14px/1 'Plus Jakarta Sans', sans-serif; color: var(--tinta-2);
  padding: 12px 13px; border: 0; border-radius: var(--r-kecil);
  background: transparent; cursor: pointer; text-align: left;
}
.tab-tombol:hover { background: var(--jade-muda); }
.tab-tombol.on { background: var(--jade-tua); color: var(--tombol-teks); }
.tab-tombol .lam { flex: 0 0 20px; font-size: 16px; line-height: 1; text-align: center; }
.tab-tombol .jml {
  margin-left: auto; font: 700 11px/1 'Plus Jakarta Sans', sans-serif;
  background: var(--emas-muda); color: var(--emas); padding: 4px 7px; border-radius: var(--r-pil);
}
.tab-tombol.on .jml { background: rgba(255,255,255,.22); color: #fff; }
.sisi.tutup .tab-tombol { justify-content: center; padding: 12px 0; }
.sisi.tutup .tab-tombol .teks, .sisi.tutup .tab-tombol .jml { display: none; }

.sisi-kaki { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--garis-tipis); }

.btn-laci {
  display: none; align-items: center; gap: 9px;
  font: 600 14px/1 'Plus Jakarta Sans', sans-serif; color: var(--tinta-2);
  padding: 11px 15px; border: 1.5px solid var(--garis); border-radius: var(--r-pil);
  background: var(--papan); cursor: pointer; margin-bottom: 15px;
}
.btn-lipat {
  display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 9px 0; border: 0; border-radius: var(--r-kecil);
  background: transparent; color: var(--tinta-3); cursor: pointer;
  font: 600 12px/1 'Plus Jakarta Sans', sans-serif;
}
.btn-lipat:hover { background: var(--jade-muda); color: var(--tinta-2); }

.isi-tab { flex: 1 1 auto; min-width: 0; }
/* Judul pertama di sebuah tab tidak perlu jarak atas — tabnya sendiri
   sudah menjadi pemisahnya. */
.isi-tab > .bagian:first-child { margin-top: 0; }

/* ---- absen mandiri ---- */
.absen-kartu {
  background: var(--papan); border: 1px solid var(--garis-tipis);
  border-radius: var(--r); padding: 19px; margin-bottom: 15px;
}
.absen-kartu h3 { font: 700 16px/1.3 'Plus Jakarta Sans', sans-serif; color: var(--tinta); margin: 0 0 5px; }
.absen-kartu p { font: 500 13.5px/1.55 'Plus Jakarta Sans', sans-serif; color: var(--tinta-3); margin: 0 0 15px; }
.absen-kartu .tombol { width: 100%; }
.absen-sudah {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  background: var(--jade-muda); border-radius: var(--r-kecil);
  font: 600 14px/1.4 'Plus Jakarta Sans', sans-serif; color: var(--jade-tua);
}
.absen-sudah .tnd { font-size: 19px; line-height: 1; }

@media (max-width: 860px) {
  .bungkus.ber-tab { max-width: 560px; }
  .tata { display: block; }
  .btn-laci { display: inline-flex; }
  .sisi {
    position: fixed; z-index: 60; inset: 0 auto 0 0; width: 268px;
    border-radius: 0 var(--r) var(--r) 0; overflow-y: auto;
    transform: translateX(-100%); transition: transform .22s ease;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,0);
  }
  .sisi.buka { transform: translateX(0); box-shadow: 0 10px 40px rgba(0,0,0,.26); }
  .sisi.tutup { flex-basis: auto; width: 268px; }
  .sisi.tutup .siswa { display: block; }
  .sisi.tutup .tab-tombol { justify-content: flex-start; padding: 12px 13px; }
  .sisi.tutup .tab-tombol .teks, .sisi.tutup .tab-tombol .jml { display: inline; }
  .btn-lipat { display: none; }
  .tirai {
    position: fixed; inset: 0; z-index: 59; background: rgba(10,20,14,.44);
    opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .tirai.on { opacity: 1; pointer-events: auto; }
}

@media (prefers-color-scheme: dark) {
  .tab-tombol:hover { background: rgba(255,255,255,.07); }
}


/* ==================================================================
   MATERI AJAR YANG DIUNGGAH GURU

   Dibedakan dari catatan pertemuan: catatan itu ringkasan satu-dua baris,
   sedangkan ini bahan belajar utuh yang memang untuk dibaca. Karena itu
   ia punya kartu sendiri yang bisa dibuka-tutup — kalau semuanya terbuka
   sekaligus, satu tab berisi lima materi akan sepanjang halaman lama yang
   justru sedang kita hilangkan.
   ================================================================== */
.ma-kartu {
  background: var(--papan); border: 1px solid var(--garis-tipis);
  border-radius: var(--r); margin-bottom: 13px; overflow: hidden;
}
.ma-kepala {
  display: flex; align-items: flex-start; gap: 12px; width: 100%;
  padding: 17px 19px; border: 0; background: transparent; cursor: pointer; text-align: left;
  border-left: 4px solid var(--ma-aksen, var(--jade));
}
.ma-kepala:hover { background: var(--jade-muda); }
.ma-kepala .ma-t { flex: 1 1 auto; min-width: 0; }
.ma-kepala b { display: block; font: 700 15.5px/1.35 'Plus Jakarta Sans', sans-serif; color: var(--tinta); }
.ma-kepala small { display: block; margin-top: 4px; font: 500 12.5px/1.45 'Plus Jakarta Sans', sans-serif; color: var(--tinta-3); }
.ma-kepala .ma-panah { flex: 0 0 auto; color: var(--tinta-3); font-size: 15px; transition: transform .18s ease; }
.ma-kartu.buka .ma-panah { transform: rotate(90deg); }
.ma-badan { padding: 3px 19px 19px; display: none; }
.ma-kartu.buka .ma-badan { display: block; }

.ma-jade { --ma-aksen: #1D6B4C; }
.ma-laut { --ma-aksen: #1E5A8A; }
.ma-senja { --ma-aksen: #9A4A1B; }
.ma-kertas { --ma-aksen: #4A4A52; }

.ma-badan .mt-h1 { font: 800 18px/1.35 'Plus Jakarta Sans', sans-serif; color: var(--ma-aksen); margin: 17px 0 7px; }
.ma-badan .mt-h2 { font: 700 15.5px/1.35 'Plus Jakarta Sans', sans-serif; color: var(--tinta); margin: 15px 0 6px; }
.ma-badan .mt-h3 { font: 700 13.5px/1.4 'Plus Jakarta Sans', sans-serif; color: var(--tinta-2); margin: 12px 0 5px; }
.ma-badan .mt-p { font: 400 14.5px/1.68 'Plus Jakarta Sans', sans-serif; color: var(--tinta-2); margin: 0 0 10px; }
.ma-badan .mt-list { margin: 0 0 12px; padding-left: 21px; }
.ma-badan .mt-list li { font: 400 14.5px/1.62 'Plus Jakarta Sans', sans-serif; color: var(--tinta-2); margin-bottom: 5px; }
.ma-badan .mt-q {
  margin: 0 0 12px; padding: 11px 15px; border-left: 3px solid var(--ma-aksen);
  background: var(--kertas); border-radius: 0 var(--r-kecil) var(--r-kecil) 0;
  font: italic 400 14.5px/1.6 'Plus Jakarta Sans', sans-serif; color: var(--tinta-2);
}
.ma-badan .mt-kode {
  margin: 0 0 12px; padding: 12px 14px; background: var(--kertas);
  border-radius: var(--r-kecil); font: 400 13px/1.55 ui-monospace, monospace;
  color: var(--tinta); white-space: pre-wrap; overflow-x: auto;
}
.ma-badan .mt-pisah { border: 0; border-top: 1px solid var(--garis-tipis); margin: 18px 0; }
.mt-tabel-bungkus { overflow-x: auto; margin: 0 0 13px; -webkit-overflow-scrolling: touch; }
.ma-badan .mt-tabel { border-collapse: collapse; width: 100%; font: 400 13.5px/1.5 'Plus Jakarta Sans', sans-serif; }
.ma-badan .mt-tabel th, .ma-badan .mt-tabel td { border: 1px solid var(--garis-tipis); padding: 7px 10px; text-align: left; }
.ma-badan .mt-tabel th { background: var(--kertas); font-weight: 700; color: var(--tinta); }

<body>
